<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 籃球動作實驗室</title>
<meta name="description" content="上傳籃球動作影片，在瀏覽器內做骨架分析，並與示範動作並排同步對照。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f6f4f0; --card: #fff; --text: #1d1b18; --muted: #6b665e; --line: #e2ddd4;
    --accent: #e4572e; --accent-text: #fff; --danger: #b3261e; --good: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --card: #211f1d; --text: #f1ede6; --muted: #a39d93; --line: #35322e;
      --accent: #f0703f; --accent-text: #1a0f0a; --danger: #f2b8b5; --good: #81c784;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  h2 { font-size: 17px; margin: 24px 0 8px; }
  p.sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  a { color: var(--accent); }
  button, select, input[type=text] {
    font: inherit; color: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); padding: 10px 14px; min-height: 44px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  button.link { border: 0; background: none; padding: 6px 8px; min-height: 0; color: var(--muted); }
  button.danger { color: var(--danger); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  label.field { display: block; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  label.field select { display: block; width: 100%; margin-top: 4px; }
  .hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .msg { font-size: 14px; color: var(--danger); margin: 10px 0 0; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  ul.list li:first-child { border-top: 0; }
  .clip-open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 4px 0; }
  .clip-open b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; }
  video { width: 100%; max-height: 60vh; background: #000; border-radius: 12px; display: block; }
  .time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
  input[type=range] { width: 100%; margin: 10px 0 4px; accent-color: var(--accent); }
  .mark-t { font-variant-numeric: tabular-nums; border: 0; background: none; padding: 4px 0; min-height: 0; color: var(--accent); font-weight: 600; }
  .mark-note { flex: 1; min-width: 0; word-break: break-word; }
  .demo svg { display: block; width: 100%; max-height: 42vh; margin: 4px 0 8px; }
  .demo svg .near, .demo svg .far, .demo svg .body { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .demo svg .near, .demo svg .body { stroke: var(--text); }
  .demo svg .far { stroke: var(--muted); opacity: .6; }
  .demo svg .head { fill: var(--card); stroke: var(--text); stroke-width: 3; }
  .demo svg .ball { fill: var(--accent); }
  .demo svg .ball.inferred { opacity: .5; }
  .demo svg .other { stroke: var(--muted); opacity: .45; }   /* 雙人時另一名球員 */   /* 看不到、推斷出來的位置 */
  .demo svg .face { stroke-width: 2.5; }
  .demo svg .near, .demo svg .far { stroke-width: 3.5; }
  .demo svg .dot { display: none; fill: var(--accent); stroke: var(--card); stroke-width: .6; }
  .demo svg.dots .dot { display: inline; }
  .demo svg .court { stroke: var(--line); stroke-width: 2; fill: none; }
  .demo-phase { margin: 0; min-height: 3em; font-size: 15px; }
  .demo-phase b { margin-right: 6px; }
  #speed { min-width: 52px; }
  .controls { gap: 6px; flex-wrap: nowrap; }
  .controls button { padding: 8px; min-width: 36px; }
  #clip-select { flex: 1; min-width: 0; padding: 8px 4px; font-size: 14px; text-overflow: ellipsis; }
  .top { flex-wrap: nowrap; align-items: center; margin-bottom: 16px; }   /* 上傳影片掣與下方關節點掣之間留空位 */
  .top h1 { margin: 0; }
  button.small { min-height: 36px; padding: 6px 12px; font-size: 14px; white-space: nowrap; }
  .compare { display: grid; grid-template-columns: 3fr 2fr; gap: 8px; align-items: center; }
  #cmp-demo svg { margin: 0; max-height: 60vh; }
  #pov { display: block; width: 100%; aspect-ratio: 6 / 5; background: var(--card); border-radius: 8px; }
  .seg { gap: 4px; flex-wrap: nowrap; }
  .seg button { padding: 4px 8px; min-height: 32px; font-size: 12px; white-space: nowrap; }
  .seg .meta { font-size: 12px; }
  .step { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .step:first-child { border-top: 0; }
  .step-pic { flex: none; width: 76px; }
  .step-pic svg { width: 100%; height: 118px; margin: 0; }
  .step-title { padding: 0; color: var(--text); font-weight: 600; }
  .step table.metrics { margin: 4px 0; font-size: 13px; }
  .step .hint { margin-top: 4px; }
  .checks { list-style: none; margin: 6px 0; padding: 0; font-size: 14px; }
  .checks li { padding-left: 1.3em; text-indent: -1.3em; margin: 3px 0; }
  .checks li::before { display: inline-block; width: 1.3em; text-indent: 0; font-weight: 700; }
  .checks .good::before { content: "✓"; color: var(--good); }
  .checks .bad::before { content: "✗"; color: var(--danger); }
  .summary { padding: 8px 0 4px; }
  .summary p { margin: 0 0 4px; }
  /* 火柴人下面的說明固定兩行高度，太長就截斷，畫面不會隨文字長短跳動 */
  #cmp-demo .demo-phase { font-size: 13px; line-height: 1.45; height: 2.9em; min-height: 0; overflow: hidden;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  #cmp-demo .demo-phase span { color: var(--muted); font-size: 12px; }
  .stage { position: relative; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  table.metrics { width: 100%; border-collapse: collapse; margin: 12px 0 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
  table.metrics th, table.metrics td { padding: 6px 4px; border-top: 1px solid var(--line); text-align: right; }
  table.metrics th:first-child, table.metrics td:first-child { text-align: left; font-weight: normal; color: var(--muted); }
  #ana-chart { display: block; width: 100%; height: 110px; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>

  <div class="row top">
    <h1 class="grow">AI 籃球動作實驗室</h1>
    <button class="primary small" id="pick">上傳影片</button>
    <input type="file" id="file" accept="video/*" hidden>
  </div>
  <p class="msg" id="pick-msg" hidden></p>

  <!-- 影片檢視：真人片（左）與示範火柴人（右）並排同步 -->
  <section id="lab">

    <div class="compare" id="compare">
      <div class="stage">
        <video id="video" playsinline muted preload="auto"></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="demo" id="cmp-demo">
        <div class="row seg">
          <button id="view-side" class="on" title="側面火柴人">側面</button><button id="view-pov" title="模擬球員眼中所見">第一身</button>
          <span class="grow"></span><button id="demo-dots">關節點</button>
        </div>
        <svg id="demo-svg" viewBox="0 0 240 200" role="img" aria-label="火柴人複製影片中的動作"></svg>
        <canvas id="pov" hidden aria-label="模擬第一身視角"></canvas>
        <p class="demo-phase"><b id="demo-label"></b><span id="demo-cue"></span></p>
      </div>
    </div>
    <input type="range" id="seek" min="0" max="0" step="0.001" value="0" aria-label="時間軸">
    <div class="row">
      <span class="time" id="time">0.00 / 0.00 秒</span>
    </div>

    <div class="row controls" style="margin-top:10px">
      <button id="first" aria-label="回到第一格" title="回到第一格">⏮</button>
      <button id="prev" aria-label="上一格" title="上一格">◀</button>
      <button class="primary" id="play">播放</button>
      <button id="speed" aria-label="播放速度（按一下切換）" title="播放速度（按一下切換）">0.5×</button>
      <button id="next" aria-label="下一格" title="下一格">▶</button>
      <select id="clip-select" aria-label="選擇影片"></select>
    </div>
    <div class="row" id="del-row" style="justify-content:flex-end;margin-top:6px">
      <button class="link danger" id="del">刪除這段影片</button>
    </div>

    <div class="card" style="margin-top:16px">
      <b>動作拆解</b>
      <div id="breakdown"></div>
    </div>

    <div class="card" id="ana" style="margin-top:16px">
      <div class="row"><b class="grow">骨架分析</b><button class="link danger" id="ana-clear" hidden>清除分析</button></div>
      <p class="hint" id="ana-status">在這部裝置上逐格辨識身體 33 點、雙手各 21 點、臉部 478 點及籃球位置，影片不會上傳。首次使用需下載約 26 MB 模型。</p>
      <button class="primary" id="ana-run" style="width:100%;margin-top:10px">開始分析</button>
      <div id="ana-out" hidden>
        <div class="row" id="ana-layers" style="margin-top:10px"></div>
        <div class="row" id="ana-events" style="margin-top:8px"></div>
        <table class="metrics" id="ana-table"></table>
        <canvas id="ana-chart" height="110" aria-label="關節角度隨時間變化"></canvas>
        <p class="hint" id="ana-legend"></p>
        <p class="hint">角度由單一鏡頭以 3D 估算，只供參考；看不清楚的關節不顯示數值。</p>
      </div>
    </div>

    <h2>時間點筆記</h2>
    <div class="card">
      <div class="row">
        <input type="text" class="grow" id="note" placeholder="例如：出手前身體向右傾" maxlength="200">
        <button class="primary" id="add-mark">標記目前時間</button>
      </div>
      <ul class="list" id="marks" style="margin-top:8px"></ul>
      <p class="empty" id="marks-empty">暫停在關鍵畫面（準備、發力、出手、落地），再按「標記目前時間」。</p>
    </div>
  </section>

  <footer class="hint" style="margin-top:24px">
    <p>建議從側面拍攝、全身入鏡、光線充足、長度 60 秒以內。影片只儲存在這部裝置的瀏覽器內，不會上傳。</p>
    <p id="credit"></p>
  </footer>

</main>
<script>
// ---- 可調常數 ----
const SPEEDS = [0.25, 0.5, 1, 1.5, 2];
const FRAME = 1 / 30;            // 逐格步長（秒）；以 30fps 計
const MAX_MB = 300;              // 單一影片大小上限
const MAX_SEC = 120;             // 單一影片長度上限

// ---- IndexedDB：clips 存資料，videos 存影片檔，分開以免改筆記時重寫影片 ----
const dbReady = new Promise((resolve, reject) => {
  const req = indexedDB.open('bball', 2);
  req.onupgradeneeded = () => {
    const db = req.result, has = n => db.objectStoreNames.contains(n);
    if (!has('clips')) db.createObjectStore('clips', { keyPath: 'id' });
    if (!has('videos')) db.createObjectStore('videos');
    if (!has('analyses')) db.createObjectStore('analyses', { keyPath: 'id' });   // 骨架分析結果，與影片同一個 id
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
async function tx(stores, mode, fn) {
  const db = await dbReady;
  return new Promise((resolve, reject) => {
    const t = db.transaction(stores, mode);
    const out = fn(t);
    t.oncomplete = () => resolve(out && 'result' in out ? out.result : undefined);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const listClips = () => tx('clips', 'readonly', t => t.objectStore('clips').getAll());
const getVideo = id => tx('videos', 'readonly', t => t.objectStore('videos').get(id));
const putClip = clip => tx('clips', 'readwrite', t => { t.objectStore('clips').put(clip); });
const addClip = (clip, blob) => tx(['clips', 'videos'], 'readwrite', t => {
  t.objectStore('clips').put(clip);
  t.objectStore('videos').put(blob, clip.id);
});
const deleteClip = id => tx(['clips', 'videos', 'analyses'], 'readwrite', t => {
  t.objectStore('clips').delete(id);
  t.objectStore('videos').delete(id);
  t.objectStore('analyses').delete(id);
});
const getAnalysis = id => tx('analyses', 'readonly', t => t.objectStore('analyses').get(id));
const putAnalysis = a => tx('analyses', 'readwrite', t => { t.objectStore('analyses').put(a); });
const deleteAnalysis = id => tx('analyses', 'readwrite', t => { t.objectStore('analyses').delete(id); });

// ---- 小工具 ----
const $ = id => document.getElementById(id);
const fmt = s => (Math.round(s * 100) / 100).toFixed(2);
const fmtDate = ms => new Date(ms).toLocaleString('zh-Hant', { dateStyle: 'medium', timeStyle: 'short' });
const el = (tag, { dataset, ...props } = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  Object.assign(n.dataset, dataset);
  n.append(...kids);
  return n;
};
function showMsg(text) { $('pick-msg').textContent = text; $('pick-msg').hidden = !text; }

// 讀取影片長度；格式不支援時回傳 null
function probeDuration(blob) {
  return new Promise(resolve => {
    const v = document.createElement('video');
    const url = URL.createObjectURL(blob);
    const done = d => { URL.revokeObjectURL(url); resolve(d); };
    v.preload = 'metadata';
    v.onloadedmetadata = () => done(isFinite(v.duration) ? v.duration : null);
    v.onerror = () => done(null);
    v.src = url;
  });
}

// ---- 首頁 ----
$('pick').onclick = () => { showMsg(''); $('file').click(); };
$('file').onchange = e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) importVideo(f);
};

// 檢查影片後存入影片庫並打開，然後自動分析：分析完火柴人就會與影片左右同步
async function importVideo(f) {
  if (f.size > MAX_MB * 1024 * 1024) return showMsg(`影片超過 ${MAX_MB} MB，請剪短後再上傳。`);
  const dur = await probeDuration(f);
  if (dur == null) return showMsg('這部裝置的瀏覽器無法播放此影片格式，請改用 MP4 或 MOV。');
  if (dur > MAX_SEC) return showMsg(`影片長度超過 ${MAX_SEC} 秒，請只保留要分析的動作片段。`);
  const clip = { id: crypto.randomUUID(), name: f.name, created: Date.now(), duration: dur, marks: [] };
  try {
    navigator.storage?.persist?.();
    await addClip(clip, f);
  } catch (err) {
    return showMsg('儲存失敗，可能是裝置空間不足。');
  }
  await openLab(clip);
  $('ana-run').click();
}

// 示範片：Pexels 授權，來源見 samples/README.md。分析結果已預先計好（samples/*.json），打開即可同步，不用等。
// 第一條（首頁預設）：側面拍攝的真人跳投；第二條：一對一，持球者換手運球、防守者貼身防守（雙人分析）。
const SAMPLES = [
  { id: 'sample', sample: true, file: 'samples/jumpshot-side.mp4', analysis: 'samples/jumpshot-side.json',
    name: '跳投示範', duration: 21.553333, marks: [],
    credit: '跳投示範片：PNW Production（Pexels）', creditUrl: 'https://www.pexels.com/video/man-wearing-sportswear-playing-basketball-8979052/' },
  { id: 'sample-crossover', sample: true, file: 'samples/crossover.mp4', analysis: 'samples/crossover.json',
    name: '一對一示範', duration: 15.6, marks: [],
    credit: '一對一示範片：Kampus Production（Pexels）', creditUrl: 'https://www.pexels.com/video/man-practicing-defense-in-basketball-6249627/' }
];
const SAMPLE = SAMPLES[0];   // 首頁預設，亦是數值比較的參考
const sampleCache = {};
async function sampleAnalysis(clip = SAMPLE) {
  if (!sampleCache[clip.id]) {
    try {
      const j = await fetch(clip.analysis).then(r => r.json());
      const f32 = a => a && Float32Array.from(a);
      j.frames = j.frames.map(f => ({ t: f.t, pose: f32(f.pose), world: f32(f.world), lh: f32(f.lh), rh: f32(f.rh), face: null, balls: f.balls,
        people: f.people && f.people.map(p => p && { pose: f32(p.pose), world: f32(p.world) }) }));
      sampleCache[clip.id] = j;
    } catch (err) {
      return null;   // 載入失敗就讓用戶自行分析
    }
  }
  return sampleCache[clip.id];
}
const clipVideo = clip => clip.sample
  ? fetch(clip.file).then(r => r.ok ? r.blob() : null).catch(() => null)
  : getVideo(clip.id);

async function renderList() {
  const all = await listClips();
  // 舊版「用示範片試試」曾把示範片複製進影片庫，現在示範片固定在首頁，刪走這些副本釋放空間
  for (const c of all) if (c.sample && !SAMPLES.some(x => x.id === c.id)) await deleteClip(c.id);
  const clips = all.filter(c => !c.sample).sort((a, b) => b.created - a.created);
  // 影片選擇：下拉清單（在「下一格」右邊），示範片排先，之後是自己上載的影片（新的在前）
  const list = [...SAMPLES, ...clips];
  $('clip-select').replaceChildren(...list.map(c => el('option', { value: c.id, textContent: c.name, selected: current?.id === c.id })));
  $('clip-select').onchange = e => { const c = list.find(x => x.id === e.target.value); if (c) openLab(c); };
}

// ---- 檢視 ----
const video = $('video');
let current = null, videoUrl = null;

// 速度：一個按鈕，按一下循環切換 0.25× → 0.5× → 正常 → 1.5× → 2×
function setSpeed(s) { video.playbackRate = s; $('speed').textContent = s === 1 ? '正常' : `${s}×`; }
$('speed').onclick = () => setSpeed(SPEEDS[(SPEEDS.indexOf(video.playbackRate) + 1) % SPEEDS.length]);

async function openLab(clip) {
  if (clip.sample) clip.marks = (await listClips()).find(c => c.id === clip.id)?.marks ?? [];
  const blob = await clipVideo(clip);
  if (!blob) return showMsg(clip.sample ? '載入示範片失敗，請檢查網絡連線後再試。' : '找不到影片檔案，可能已被瀏覽器清除。');
  showMsg('');
  current = clip;
  video.pause();
  if (videoUrl) URL.revokeObjectURL(videoUrl);
  videoUrl = URL.createObjectURL(blob);
  video.src = videoUrl;
  video.muted = true;   // 只看動作，不播聲音
  setSpeed(0.5);
  $('del-row').hidden = !!clip.sample;
  $('note').value = '';
  renderMarks();
  showAnalysis(clip.sample ? await sampleAnalysis(clip) : await getAnalysis(clip.id));
  renderList();
}

function step(dir) {
  video.pause();
  video.currentTime = Math.min(Math.max(video.currentTime + dir * FRAME, 0), video.duration || 0);
}

function updateTime() {
  const d = video.duration || 0;
  $('seek').max = d;
  $('seek').value = video.currentTime;
  $('time').textContent = `${fmt(video.currentTime)} / ${fmt(d)} 秒`;
}
video.addEventListener('loadedmetadata', updateTime);
video.addEventListener('timeupdate', updateTime);
video.addEventListener('seeked', updateTime);
video.addEventListener('play', () => $('play').textContent = '暫停');
video.addEventListener('pause', () => $('play').textContent = '播放');
video.addEventListener('ended', () => $('play').textContent = '重播');
$('seek').oninput = e => { video.pause(); video.currentTime = +e.target.value; };
$('play').onclick = () => video.paused ? video.play() : video.pause();
$('first').onclick = () => { video.pause(); video.currentTime = 0; };
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('del').onclick = async () => {
  if (!confirm('確定刪除這段影片及所有筆記？此操作無法復原。')) return;
  await deleteClip(current.id);
  openLab(SAMPLE);
};

// 鍵盤：← → 逐格，空白鍵播放／暫停（輸入筆記時不攔截）

// ---- 右邊火柴人：畫法 ----
// 火柴人由分析得到的關節逐格驅動（見下方「右邊火柴人複製真人動作」），這裡只負責畫。
const GROUND = 185, BALL_R = 6;
const SVGNS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs) => {

// 雙人時的另一名球員：淡色，畫在後面

const PATHS = ['farArm', 'farLeg', 'body', 'nose', 'nearLeg', 'nearArm'];
// 關節點（可切換顯示）
const DOTS = ['p', 'm', 'c', 'n', 'nk', 'h', ...['s', 'e', 'w', 'g', 'q', 'u', 'h', 'k', 'a', 'l', 'o', 't'].flatMap(s => [s + 'N', s + 'F'])];

// 各部分的路徑；j = 各關節座標（N = 靠近鏡頭一邊，F = 另一邊）
function figurePaths(j) {
  const pt = n => j[n].map(v => v.toFixed(1)).join(',');
  const line = (...names) => 'M' + names.map(pt).join(' L');
  const arm = s => `${line('s' + s, 'e' + s, 'w' + s, 'g' + s, 'q' + s)} ${line('w' + s, 'u' + s)}`;
  const leg = s => `${line('h' + s, 'k' + s, 'a' + s, 'l' + s, 'o' + s, 't' + s)} ${line('a' + s, 'o' + s)}`;
  return {
    farArm: arm('F'), farLeg: leg('F'), nearArm: arm('N'), nearLeg: leg('N'),
    body: `${line('hF', 'hN')} ${line('p', 'm', 'c', 'n', 'nk', 'h')} ${line('sF', 'sN')}`,
    nose: j.nose ? line('ns', 'nose') : ''
  };
}
function drawFigure(j, ball, inferred, F = fig) {
  const d = figurePaths(j), extra = F === fig ? dots : [];
  for (const k of PATHS) F[k].setAttribute('d', d[k]);
  F.head.setAttribute('cx', j.h[0]); F.head.setAttribute('cy', j.h[1]);
  if (F === fig) DOTS.forEach((n, x) => { dots[x].setAttribute('cx', j[n][0]); dots[x].setAttribute('cy', j[n][1]); });
  for (const n of [...Object.values(F), ...extra]) n.style.visibility = '';
  F.ball.style.display = ball ? '' : 'none';
  if (ball) { F.ball.setAttribute('cx', ball[0]); F.ball.setAttribute('cy', ball[1]); }
  F.ball.classList.toggle('inferred', !!inferred);
}
function hideFigure(F = fig) { for (const n of [...Object.values(F), ...(F === fig ? dots : [])]) n.style.visibility = 'hidden'; }
// 定格小圖（動作拆解用），畫面裁到火柴人附近
function figureSvg(j, ball, inferred) {
  const d = figurePaths(j), xs = DOTS.map(n => j[n][0]), ys = DOTS.map(n => j[n][1]);
  if (ball) { xs.push(ball[0]); ys.push(ball[1]); }
  const x0 = Math.min(...xs) - 12, y0 = Math.min(...ys) - 12, w = Math.max(...xs) + 12 - x0, h = Math.max(GROUND + 4, ...ys) - y0;
  const n = v => v.toFixed(1);
  return `<svg viewBox="${n(x0)} ${n(y0)} ${n(w)} ${n(h)}" aria-hidden="true">`
    + `<line class="court" x1="${n(x0)}" y1="${GROUND + 1}" x2="${n(x0 + w)}" y2="${GROUND + 1}"/>`
    + PATHS.map(k => `<path class="${fig[k].getAttribute('class')}" d="${d[k]}"/>`).join('')
    + `<circle class="head" r="8" cx="${n(j.h[0])}" cy="${n(j.h[1])}"/>`
    + (ball ? `<circle class="ball${inferred ? ' inferred' : ''}" r="${BALL_R}" cx="${n(ball[0])}" cy="${n(ball[1])}"/>` : '') + '</svg>';
}

// ---- 骨架分析：MediaPipe 在瀏覽器內逐格辨識，影片不會上傳 ----
// Holistic：身體 33 點（含 3D 世界座標）＋左右手各 21 點＋臉部 478 點；EfficientDet：籃球位置。
const MP_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/';
const HOLISTIC_MODEL = MODEL_URL + 'holistic_landmarker/holistic_landmarker/float16/1/holistic_landmarker.task';
const BALL_MODEL = MODEL_URL + 'object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite';
const ANALYZE_FPS = 30;        // 每秒分析格數
const MAX_FRAMES = 900;        // 長片自動降低格數，避免分析太久
const ANALYSIS_VERSION = 3;    // 分析方法改變時加一，方便比較新舊結果
const MIN_VIS = 0.5;           // 關節可見度低於此值就不計算、不繪畫
// Pose 33 點索引；[左, 右] 指球員本人的左右
const PL = { sh: [11, 12], el: [13, 14], wr: [15, 16], hip: [23, 24], kn: [25, 26], an: [27, 28], toe: [31, 32] };
const POSE_CONN = [[11, 12], [11, 13], [13, 15], [15, 17], [15, 19], [15, 21], [17, 19], [12, 14], [14, 16], [16, 18], [16, 20],
  [16, 22], [18, 20], [11, 23], [12, 24], [23, 24], [23, 25], [24, 26], [25, 27], [26, 28], [27, 29], [28, 30], [29, 31], [30, 32], [27, 31], [28, 32]];
const HAND_CONN = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12],
  [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]];
const C_LEFT = '#4fc3f7', C_RIGHT = '#ff8a3d', C_MID = '#ffffff', C_BALL = '#ffd54f';
const POSE_GROUPS = [[C_LEFT, c => c.every(j => j % 2 === 1)], [C_RIGHT, c => c.every(j => j % 2 === 0)], [C_MID, () => true]]
  .map(([color, test], g, all) => [color, POSE_CONN.filter(c => test(c) && !all.slice(0, g).some(([, t]) => t(c)))]);

let mp = null, mpClock = 0;   // detectForVideo 的時間戳必須一直遞增，跨影片也一樣
async function loadModels(status) {
  if (mp) return mp;
  status('下載分析程式…');
  const vision = await import(`${MP_URL}/vision_bundle.mjs`);
  const files = await vision.FilesetResolver.forVisionTasks(`${MP_URL}/wasm`);
  // 優先用 GPU，不支援時改用 CPU
  const create = async (Task, opts, runningMode = 'VIDEO') => {
    for (const delegate of ['GPU', 'CPU']) {
      try { return await Task.createFromOptions(files, { ...opts, runningMode, baseOptions: { ...opts.baseOptions, delegate } }); }
      catch (err) { if (delegate === 'CPU') throw err; }
    }
  };
  status('下載身體、手部及臉部模型（約 14 MB）…');
  const holistic = await create(vision.HolisticLandmarker, { baseOptions: { modelAssetPath: HOLISTIC_MODEL }, minHandLandmarksConfidence: 0.3 });
  status('下載籃球偵測模型（約 12 MB）…');
  const ball = await create(vision.ObjectDetector, {
    baseOptions: { modelAssetPath: BALL_MODEL }, categoryAllowlist: ['sports ball'], scoreThreshold: 0.2, maxResults: 3
  });
  // 數人數用（單張畫面模式，不用時間戳）
  const people = await create(vision.ObjectDetector, { baseOptions: { modelAssetPath: BALL_MODEL }, categoryAllowlist: ['person'], scoreThreshold: 0.5, maxResults: 4 }, 'IMAGE');
  return (mp = { holistic, ball, people });
}

// 關節座標壓成 Float32Array 儲存（每點 x, y, z，身體另加可見度）
function flat(points, k) {
  if (!points) return null;
  const a = new Float32Array(points.length * k);
  points.forEach((p, i) => { a[i * k] = p.x; a[i * k + 1] = p.y; a[i * k + 2] = p.z; if (k === 4) a[i * k + 3] = p.visibility ?? 1; });
  return a;
}
function packFrame(t, h, balls) {
  return {
    t, balls,
    pose: flat(h.poseLandmarks[0], 4), world: flat(h.poseWorldLandmarks[0], 3),
    lh: flat(h.leftHandLandmarks[0], 3), rh: flat(h.rightHandLandmarks[0], 3), face: flat(h.faceLandmarks[0], 3)
  };
}

// 籃球在全畫面只得幾個像素，所以先按身體位置裁出球員附近（頭頂上方留多些位置看球路）再偵測。
// 回傳裁切範圍（像素）；未辨識到身體時沿用上一格。
function playerCrop(poses, W, H, last) {
  let x0 = 1, x1 = 0, y0 = 1, y1 = 0;
  for (const pose of [poses].flat().filter(Boolean)) for (let i = 0; i < 33; i++) {   // 雙人時包住兩人
    if (pose[i * 4 + 3] < MIN_VIS) continue;
    x0 = Math.min(x0, pose[i * 4]); x1 = Math.max(x1, pose[i * 4]);
    y0 = Math.min(y0, pose[i * 4 + 1]); y1 = Math.max(y1, pose[i * 4 + 1]);
  }
  if (x1 <= x0) return last ?? { x: 0, y: 0, s: Math.min(W, H) };
  const s = Math.min(Math.max((y1 - y0) * H * 2.4, (x1 - x0) * W * 1.3, 320), W, H);
  return {
    x: Math.min(Math.max((x0 + x1) / 2 * W - s / 2, 0), W - s),
    y: Math.min(Math.max(y0 * H - s * 0.45, 0), H - s), s
  };
}

const seekTo = async (v, t) => { if (Math.abs(v.currentTime - t) > 1e-4) await new Promise(r => { v.onseeked = r; v.currentTime = t; }); };

// 數人數：兩名球員經常前後重疊、被當成一個人，所以 16 格中有兩格或以上清楚分開兩名夠大的人（高度 ≥ 畫面四分之一）就算雙人。
// 回傳兩人分得最開的一格作為追蹤起點；不是雙人回傳 null。
async function findTwoPeople(v, people, dur) {
  let best = null, hits = 0;
  for (let q = 0; q < 16; q++) {
    const t = dur * (q + 0.5) / 16;
    await seekTo(v, t);
    const boxes = people.detect(v).detections.map(d => d.boundingBox).filter(b => b.height >= v.videoHeight * 0.25);
    if (boxes.length < 2) continue;
    hits++;
    const [a, b] = boxes, sep = Math.abs(a.originX + a.width / 2 - b.originX - b.width / 2);
    if (!best || sep > best.sep) best = { t, boxes: [a, b], sep };
  }
  return hits >= 2 ? best : null;
}

// ---- 雙人：MoveNet MultiPose（TensorFlow.js）----
// MediaPipe 的身體模型一次只認一個人，兩人重疊時第二人的方框會被當成同一人刪走。MoveNet MultiPose 先找出畫面中所有關節點、
// 再分給不同的人，對抗、重疊時仍分得開。每人 17 點（沒有手指、腳跟、腳尖）、沒有 3D 座標，所以雙人模式的角度按畫面 2D 計算。
// 只在畫面中有兩名球員時才下載（TensorFlow.js 約 1.4 MB＋模型約 4.7 MB；沒有 WebGL 時另加 WebAssembly 約 1 MB）。
const TFJS_URL = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js';
const TFJS_WASM = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/';   // 沒有 WebGL 時用 WebAssembly（比純 CPU 快約 25 倍）
const MOVENET_URL = 'https://tfhub.dev/google/tfjs-model/movenet/multipose/lightning/1';
// MoveNet 17 點 → MediaPipe 33 點的索引；其餘點用最近的點代替、可見度 0（不會用來計算或畫在影片上）
const MOVENET_TO_MP = [0, 2, 5, 7, 8, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
const MP_STAND_IN = { 1: 0, 3: 0, 4: 0, 6: 0, 9: 0, 10: 0, 17: 15, 19: 15, 21: 15, 18: 16, 20: 16, 22: 16, 29: 27, 31: 27, 30: 28, 32: 28 };
const MOVENET_MIN = 0.25;      // 人的分數低於此值不要
const FILL_MAX = 0.5;          // 被擋住不超過 0.5 秒就用前後格補上
let movenet = null;
async function loadMoveNet(status) {
  if (movenet) return movenet;
  status('下載雙人身體模型（約 6 MB）…');
  const script = src => new Promise((res, rej) => document.head.append(Object.assign(document.createElement('script'), { src, onload: res, onerror: () => rej(new Error('無法載入雙人身體模型')) })));
  if (!window.tf) await script(TFJS_URL);
  // 優先用 GPU（WebGL），不行就用 WebAssembly，最後才用純 CPU
  if (!await tf.setBackend('webgl').catch(() => false)) {
    try { await script(TFJS_WASM + 'tf-backend-wasm.min.js'); tf.wasm.setWasmPaths(TFJS_WASM); if (!await tf.setBackend('wasm')) throw 0; }
    catch (err) { await tf.setBackend('cpu'); }
  }
  await tf.ready();
  return (movenet = await tf.loadGraphModel(MOVENET_URL, { fromTFHub: true }));
}
// 一格畫面中的所有人，轉成 MediaPipe 格式：pose（33×4，畫面比例＋可見度）、world（33×3，畫面像素 ÷ 1000，z = 0）
function moveNetPeople(model, v) {
  const W = v.videoWidth, H = v.videoHeight, w = 512, h = Math.max(32, Math.round(512 * H / W / 32) * 32);
  const out = tf.tidy(() => model.predict(tf.image.resizeBilinear(tf.browser.fromPixels(v), [h, w]).cast('int32').expandDims(0)).arraySync()[0]);
  return out.filter(p => p[55] >= MOVENET_MIN).map(p => {
    const pose = new Float32Array(33 * 4), world = new Float32Array(33 * 3);
    MOVENET_TO_MP.forEach((m, k) => {
      pose[m * 4] = p[k * 3 + 1]; pose[m * 4 + 1] = p[k * 3]; pose[m * 4 + 3] = p[k * 3 + 2];
      world[m * 3] = p[k * 3 + 1] * W / 1000; world[m * 3 + 1] = p[k * 3] * H / 1000;
    });
    for (const [m, from] of Object.entries(MP_STAND_IN)) {
      pose[m * 4] = pose[from * 4]; pose[m * 4 + 1] = pose[from * 4 + 1];
      world[m * 3] = world[from * 3]; world[m * 3 + 1] = world[from * 3 + 1];
    }
    return { pose, world };
  });
}

// 雙人追蹤：每格用 MoveNet 找出所有人，再按球衣顏色（加少少位置）分給兩名球員，身份不會對調；
// 起點那一格量兩人球衣顏色（左邊為球員 1），兩人顏色太接近就不做雙人。被擋住不超過 0.5 秒的格用前後補上（可見度調低）。
async function trackPeopleMoveNet(v, start, model, fps, n, dur, status) {
  const W = v.videoWidth, H = v.videoHeight, people = Array.from({ length: n }, () => [null, null]);
  const thumb = document.createElement('canvas'), tctx = thumb.getContext('2d', { willReadFrequently: true });
  thumb.width = 240; thumb.height = Math.round(240 * H / W);
  let pix = null;
  const grabFrame = () => { tctx.drawImage(v, 0, 0, thumb.width, thumb.height); pix = tctx.getImageData(0, 0, thumb.width, thumb.height).data; };
  // 身體（肩至髖之間、向內收窄）的平均顏色
  const torso = pose => {
    const xs = [11, 12, 23, 24].map(j => pose[j * 4]), ys = [11, 12, 23, 24].map(j => pose[j * 4 + 1]);
    let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const sx = (x1 - x0) * 0.25, sy = (y1 - y0) * 0.2;
    x0 = Math.floor((x0 + sx) * thumb.width); x1 = Math.ceil((x1 - sx) * thumb.width);
    y0 = Math.floor((y0 + sy) * thumb.height); y1 = Math.ceil((y1 - sy) * thumb.height);
    let r = 0, g = 0, b = 0, c = 0;
    for (let y = Math.max(0, y0); y <= Math.min(thumb.height - 1, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(thumb.width - 1, x1); x++) {
      const q = (y * thumb.width + x) * 4; r += pix[q]; g += pix[q + 1]; b += pix[q + 2]; c++;
    }
    return c ? [r / c, g / c, b / c] : null;
  };
  const cdist = (a, b) => a && b ? Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) : Infinity;
  const posOf = pose => ({ x: (pose[23 * 4] + pose[24 * 4]) / 2, y: (pose[23 * 4 + 1] + pose[24 * 4 + 1]) / 2 });
  const detect = () => { grabFrame(); return moveNetPeople(model, v).map(p => ({ ...p, pos: posOf(p.pose), colour: torso(p.pose) })); };

  // 起點：取最接近兩個人物方框的兩人
  await seekTo(v, start.t);
  const startCands = detect();
  const boxes = start.boxes.map(b => ({ x: (b.originX + b.width / 2) / W, y: (b.originY + b.height / 2) / H })).sort((a, b) => a.x - b.x);
  const firstPick = boxes.map(b => startCands.slice().sort((p, q) => Math.hypot(p.pos.x - b.x, p.pos.y - b.y) - Math.hypot(q.pos.x - b.x, q.pos.y - b.y))[0]);
  if (!firstPick[0] || !firstPick[1] || firstPick[0] === firstPick[1] || cdist(firstPick[0].colour, firstPick[1].colour) < 30) return null;
  const colour = firstPick.map(p => [...p.colour]), last = firstPick.map(p => p.pos);

  for (let i = 0; i < n; i++) {
    await seekTo(v, Math.min(i / fps, Math.max(dur - 0.01, 0)));
    const cands = detect();
    // 按顏色配對（相差太遠不收），位置只作輔助；兩人不可取同一個人
    const pairs = [];
    cands.forEach((c, q) => [0, 1].forEach(k => {
      const cd = cdist(c.colour, colour[k]);
      if (cd < 70) pairs.push([cd + Math.hypot(c.pos.x - last[k].x, c.pos.y - last[k].y) * 100, q, k]);
    }));
    pairs.sort((a, b) => a[0] - b[0]);
    const usedC = new Set(), usedK = new Set();
    for (const [, q, k] of pairs) {
      if (usedC.has(q) || usedK.has(k)) continue;
      usedC.add(q); usedK.add(k);
      people[i][k] = { pose: cands[q].pose, world: cands[q].world };
      last[k] = cands[q].pos;
      colour[k] = colour[k].map((c0, z) => c0 * 0.9 + cands[q].colour[z] * 0.1);   // 顏色慢慢跟光線變化
    }
    if (i % 5 === 0) status(`追蹤兩名球員 ${i + 1} / ${n} 格…`);
  }

  // 被擋住的短時間：前後兩次看到之間線性補上，可見度設為 0.4（低於計算門檻，只用於火柴人）
  const maxGap = Math.round(fps * FILL_MAX);
  for (const k of [0, 1]) {
    for (let i = 0; i < n; i++) {
      if (people[i][k] || !people[i - 1]?.[k]) continue;
      let j = i;
      while (j < n && !people[j][k]) j++;
      if (j < n && j - i <= maxGap) {
        const a = people[i - 1][k], b = people[j][k];
        for (let q = i; q < j; q++) {
          const t = (q - i + 1) / (j - i + 1), pose = a.pose.map((v0, z) => v0 + (b.pose[z] - v0) * t), world = a.world.map((v0, z) => v0 + (b.world[z] - v0) * t);
          for (let m = 0; m < 33; m++) pose[m * 4 + 3] = Math.min(0.4, a.pose[m * 4 + 3], b.pose[m * 4 + 3]);
          people[q][k] = { pose, world, filled: true };
        }
      }
      i = j;
    }
  }
  return people;
}

async function analyzeClip(clip, blob, status) {
  const { holistic, ball, people: counter } = await loadModels(status);
  // 另開一個隱藏的 video 逐格跳轉，不影響畫面上的播放器
  const v = Object.assign(document.createElement('video'), { muted: true, playsInline: true, preload: 'auto' });
  v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
  const url = URL.createObjectURL(blob);
  document.body.append(v);
  try {
    v.src = url;
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('影片無法讀取')); });
    const dur = v.duration, fps = Math.min(ANALYZE_FPS, MAX_FRAMES / dur), n = Math.floor(dur * fps) + 1;
    const W = v.videoWidth, H = v.videoHeight, base = mpClock + 1000, frames = [];
    const crop = document.createElement('canvas'), cctx2 = crop.getContext('2d');
    status('檢查畫面中有幾名球員…');
    const start = await findTwoPeople(v, counter, dur);
    const tracked = start && await trackPeopleMoveNet(v, start, await loadMoveNet(status), fps, n, dur, status), nPeople = tracked ? 2 : 1;
    let box = null;
    for (let i = 0; i < n; i++) {
      const t = Math.min(i / fps, Math.max(dur - 0.01, 0));
      if (Math.abs(v.currentTime - t) > 1e-4) await new Promise(r => { v.onseeked = r; v.currentTime = t; });
      const ts = Math.round(base + t * 1000) + i;
      const people = tracked ? tracked[i] : null, h = tracked ? null : holistic.detectForVideo(v, ts);
      box = playerCrop(people ? people.map(p => p?.pose) : flat(h.poseLandmarks[0], 4), W, H, box);
      crop.width = crop.height = Math.round(box.s);
      cctx2.drawImage(v, box.x, box.y, box.s, box.s, 0, 0, crop.width, crop.height);
      const k = box.s / crop.width;
      const balls = ball.detectForVideo(crop, ts).detections.map(d => {
        const b = d.boundingBox;
        return [(box.x + (b.originX + b.width / 2) * k) / W, (box.y + (b.originY + b.height / 2) * k) / H,
          Math.max(b.width, b.height) * k / 2 / W, d.categories[0].score];
      });
      frames.push(people ? { t, balls, people, pose: null, world: null, lh: null, rh: null, face: null } : packFrame(t, h, balls));
      if (i % 3 === 0 || i === n - 1) status(`分析中 ${i + 1} / ${n} 格…`);
    }
    mpClock = Math.round(base + dur * 1000) + n + 1;
    const ballTrack = await refineBall(v, frames, W, H, fps, status);
    return { id: clip.id, version: ANALYSIS_VERSION, fps, w: W, h: H, created: Date.now(), frames, ballTrack, people: nPeople };
  } finally {
    v.remove();
    URL.revokeObjectURL(url);
  }
}

// ---- 籃球補追蹤 ----
// 偵測器只在部分畫面找到籃球（被手遮住、動得快、太細）。以偵測到的格為起點，用影像比對
// （正規化互相關 NCC，比對球的顏色外觀）向前、向後逐格追蹤，直到遇到下一個偵測結果或比對分數太低。
const NCC_MIN = 0.55;          // 低於此分數視為跟丟
const NCC_SIZE = 16;           // 比對時把球附近縮放到約 16 像素，兼顧速度與準確度
async function refineBall(v, frames, W, H, fps, status) {
  const n = frames.length, det = trackBall({ frames, w: W, h: H, fps });   // 已去掉靜止誤認
  const px = b => [b[0] * W, b[1] * H, b[2] * W];
  const can = document.createElement('canvas'), ctx = can.getContext('2d', { willReadFrequently: true });
  const seek = async i => { const t = frames[i].t; if (Math.abs(v.currentTime - t) > 1e-4) await new Promise(r => { v.onseeked = r; v.currentTime = t; }); };
  // 取以 (cx, cy) 為中心、邊長 size 像素的畫面，縮成 out × out 的 RGB 數組
  const grab = (cx, cy, size, out) => {
    can.width = can.height = out;
    ctx.drawImage(v, cx - size / 2, cy - size / 2, size, size, 0, 0, out, out);
    const d = ctx.getImageData(0, 0, out, out).data, g = new Float32Array(out * out * 3);
    for (let i = 0, k = 0; i < d.length; i += 4) { g[k++] = d[i]; g[k++] = d[i + 1]; g[k++] = d[i + 2]; }
    return g;
  };
  // 在 S（sw × sw）中找最像 T（tw × tw）的位置，回傳 [左上 x, 左上 y, 分數]
  const match = (S, sw, T, tw) => {
    const N = tw * tw * 3, tm = T.reduce((a, b) => a + b, 0) / N, tv = T.reduce((a, b) => a + (b - tm) ** 2, 0);
    let best = [0, 0, -1];
    for (let oy = 0; oy <= sw - tw; oy++) for (let ox = 0; ox <= sw - tw; ox++) {
      let sm = 0, cov = 0, sv = 0;
      for (let y = 0; y < tw; y++) { const row = ((oy + y) * sw + ox) * 3; for (let x = 0; x < tw * 3; x++) sm += S[row + x]; }
      sm /= N;
      for (let y = 0; y < tw; y++) {
        const row = ((oy + y) * sw + ox) * 3, trow = y * tw * 3;
        for (let x = 0; x < tw * 3; x++) { const a = S[row + x] - sm; cov += a * (T[trow + x] - tm); sv += a * a; }
      }
      const score = cov / Math.sqrt(sv * tv || 1);
      if (score > best[2]) best = [ox, oy, score];
    }
    return best;
  };
  const found = det.map(b => b && { b: px(b), score: 1 });
  // 由偵測到的格 a 向 dir（+1 向後、-1 向前）追蹤
  const follow = async (a, dir) => {
    let [x, y, r] = px(det[a]), vx = 0, vy = 0;
    if (det[a - dir]) { const p = px(det[a - dir]); vx = x - p[0]; vy = y - p[1]; }
    const size = r * 2.4, k = NCC_SIZE / size;
    await seek(a);
    let T = grab(x, y, size, NCC_SIZE);
    const hist = [];
    for (let i = a + dir, steps = 0; i >= 0 && i < n && !det[i] && steps < fps; i += dir, steps++) {
      await seek(i);
      const cx = x + vx, cy = y + vy, region = size * 3 + (Math.abs(vx) + Math.abs(vy)) * 2, sw = Math.round(region * k);
      const [ox, oy, score] = match(grab(cx, cy, region, sw), sw, T, NCC_SIZE);
      if (score < NCC_MIN) break;
      const nx = cx - region / 2 + (ox + NCC_SIZE / 2) / k, ny = cy - region / 2 + (oy + NCC_SIZE / 2) / k;
      const now = grab(nx, ny, size, NCC_SIZE);
      if (!ballColour(now)) break;   // 比對到的地方不是籃球的顏色（例如背景、衣服），停止
      // 位置定住不動、但球員的手已經移開：鎖住了背景，停止
      hist.push([nx, ny]);
      const ps = posesOf(frames[i]), wrist = ps.length ? Math.min(...ps.flatMap(p => [15, 16].map(j => Math.hypot(nx - p[j * 4] * W, ny - p[j * 4 + 1] * H)))) : null;
      if (hist.length >= 5 && Math.hypot(nx - hist.at(-5)[0], ny - hist.at(-5)[1]) < r * 0.4 && wrist > r * 4) break;
      vx = (vx + nx - x) / 2; vy = (vy + ny - y) / 2; x = nx; y = ny;
      if (!found[i] || found[i].score < score) found[i] = { b: [x, y, r], score };
      if (score > 0.85) T = T.map((t, q) => t * 0.85 + now[q] * 0.15);   // 只在把握高時慢慢更新範本（球會旋轉、光暗會變）
    }
  };
  // 籃球的顏色：橙至啡色（色相約 8–45°），有一定飽和度；只看中間部分，避開邊緣背景
  function ballColour(g) {
    let r = 0, gg = 0, b = 0, c = 0;
    for (let y = 4; y < NCC_SIZE - 4; y++) for (let x = 4; x < NCC_SIZE - 4; x++) {
      const q = (y * NCC_SIZE + x) * 3; r += g[q]; gg += g[q + 1]; b += g[q + 2]; c++;
    }
    r /= c; gg /= c; b /= c;
    const max = Math.max(r, gg, b), min = Math.min(r, gg, b);
    if (max - min < 25 || (max - min) / max < 0.2 || max !== r) return false;
    const hue = 60 * ((gg - b) / (max - min));
    return hue >= 8 && hue <= 45;
  }
  const anchors = det.flatMap((b, i) => b ? [i] : []);
  for (const [q, a] of anchors.entries()) {
    if (q % 5 === 0) status(`追蹤籃球 ${q + 1} / ${anchors.length}…`);
    if (a + 1 < n && !det[a + 1]) await follow(a, 1);
    if (a > 0 && !det[a - 1]) await follow(a, -1);
  }
  return found.map(f => f && [f.b[0] / W, f.b[1] / H, f.b[2] / W, f.score]);
}

// 清理籃球軌跡（只用座標，所以舊分析也適用）：
// 1. 補追蹤的點前後 5 格幾乎不動、又遠離雙手：多數是鎖住了背景；
// 2. 只有這一格跳開、前後兩格卻很接近：雜訊；
// 3. 前後都沒有點、又遠離球員：孤立誤認。
// 補追蹤的點分數 < 1（偵測到的格記為 1）；沒有補追蹤資料時只做 2、3。
function cleanTrack(A, track) {
  const F = A.frames, n = track.length, refined = !!A.ballTrack;
  const height = i => { const p = F[i].pose; return p && Math.max((Math.max(p[27 * 4 + 1], p[28 * 4 + 1]) - p[1]) * A.h, 50); };
  const pos = i => track[i] && [track[i][0] * A.w, track[i][1] * A.h];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const fromBody = (i, idx) => { const p = F[i].pose, b = pos(i); return Math.min(...idx.map(j => dist(b, [p[j * 4] * A.w, p[j * 4 + 1] * A.h]))); };
  const drop = new Set();
  for (let i = 0; i < n; i++) {
    const h = height(i), b = pos(i);
    if (!b || !h) continue;
    const win = [-2, -1, 1, 2].map(k => pos(i + k));
    if (refined && track[i][3] < 1 && win.every(Boolean) && Math.max(...win.map(w => dist(w, b))) < h * 0.03 && fromBody(i, [15, 16]) > h * 0.5) drop.add(i);
    const p0 = pos(i - 1), p1 = pos(i + 1);
    if (p0 && p1 && dist(p0, p1) < h * 0.15 && dist(b, p0) > h * 0.3 && dist(b, p1) > h * 0.3) drop.add(i);
    if (!p0 && !p1 && fromBody(i, [23, 24]) > h * 1.5) drop.add(i);
  }
  return track.map((b, i) => drop.has(i) ? null : b);
}

// ---- 由關節座標計算指標 ----
const sub = (a, b) => a.map((v, i) => v - b[i]);
const angleBetween = (u, v) => {
  const d = u.reduce((s, x, i) => s + x * v[i], 0) / (Math.hypot(...u) * Math.hypot(...v) || 1);
  return Math.acos(Math.min(1, Math.max(-1, d))) * 180 / Math.PI;
};
function metricsOf(f, A) {
  if (!f.pose || !f.world) return null;
  const vis = i => f.pose[i * 4 + 3] >= MIN_VIS;
  const w = i => [f.world[i * 3], f.world[i * 3 + 1], f.world[i * 3 + 2]];
  const img = (arr, i, k) => [arr[i * k] * A.w, arr[i * k + 1] * A.h];
  // 三點角度用 3D 世界座標（米），減少拍攝角度造成的誤差
  const ang = (a, b, c) => vis(a) && vis(b) && vis(c) ? angleBetween(sub(w(a), w(b)), sub(w(c), w(b))) : null;
  // 手腕屈曲：前臂方向與手掌方向（手腕→中指根部）的夾角，0° 即手腕伸直
  const wrist = s => {
    const hand = s ? f.rh : f.lh;
    if (!hand || !vis(PL.el[s]) || !vis(PL.wr[s])) return null;
    const e = img(f.pose, PL.el[s], 4), wr = img(f.pose, PL.wr[s], 4);
    return angleBetween(sub(wr, e), sub(img(hand, 9, 3), img(hand, 0, 3)));
  };
  const m = {
    side: [0, 1].map(s => ({
      elbow: ang(PL.sh[s], PL.el[s], PL.wr[s]), shoulder: ang(PL.hip[s], PL.sh[s], PL.el[s]),
      hip: ang(PL.sh[s], PL.hip[s], PL.kn[s]), knee: ang(PL.hip[s], PL.kn[s], PL.an[s]),
      ankle: ang(PL.kn[s], PL.an[s], PL.toe[s]), wrist: wrist(s)
    })),
    lean: null, stance: null, hipY: null,
    conf: f.pose.filter((_, i) => i % 4 === 3).reduce((s, v) => s + v, 0) / 33
  };
  const mid = (a, b) => w(a).map((v, i) => (v + w(b)[i]) / 2);
  if ([...PL.sh, ...PL.hip].every(vis)) m.lean = angleBetween(sub(mid(11, 12), mid(23, 24)), [0, -1, 0]);
  if ([...PL.sh, ...PL.an].every(vis)) {
    const across = (a, b) => { const d = sub(w(a), w(b)); return Math.hypot(d[0], d[2]); };
    m.stance = across(27, 28) / across(11, 12);
  }
  if (PL.hip.every(vis)) m.hipY = (f.pose[23 * 4 + 1] + f.pose[24 * 4 + 1]) / 2;
  return m;
}

// 以肩寬（像素）為單位量距離，球員遠近不同也可比較
// 側面拍攝時兩邊肩膀重疊、肩寬很細，所以取肩寬與 0.6 倍軀幹長度中較大者
// 一格中所有球員的身體點（單人模式只有一個）
const posesOf = f => f.people ? f.people.filter(Boolean).map(p => p.pose) : f.pose ? [f.pose] : [];
const shoulderPx = (A, f) => {
  const p = posesOf(f)[0];
  if (!p) return 50;
  const at = i => [p[i * 4] * A.w, p[i * 4 + 1] * A.h], mid = (a, b) => at(a).map((v, k) => (v + at(b)[k]) / 2);
  return Math.max(Math.hypot(...sub(at(11), at(12))), Math.hypot(...sub(mid(11, 12), mid(23, 24))) * 0.6) || 50;
};
const handDist = (A, f, c) => {
  const ps = posesOf(f);
  return ps.length ? Math.min(...ps.flatMap(p => [15, 16].map(j => Math.hypot((c[0] - p[j * 4]) * A.w, (c[1] - p[j * 4 + 1]) * A.h)))) / shoulderPx(A, f) : Infinity;
};

// 籃球追蹤：先去掉長時間停在同一位置、又遠離雙手的物件（例如牆上的裝飾），再逐格揀最接近上一格球位（或手）的候選
function trackBall(A) {
  const n = A.frames.length, cands = A.frames.map(f => f.balls ?? []);
  const cell = c => `${Math.round(c[0] * 25)},${Math.round(c[1] * 25)}`, cells = new Map();
  cands.forEach((cs, i) => cs.forEach(c => {
    const e = cells.get(cell(c)) ?? { frames: new Set(), far: 0, all: 0 };
    e.frames.add(i); e.all++;
    if (handDist(A, A.frames[i], c) > 1.5) e.far++;
    cells.set(cell(c), e);
  }));
  const isStatic = c => { const e = cells.get(cell(c)); return e.frames.size > n * 0.2 && e.far / e.all > 0.7; };
  const track = [];
  let prev = null, prevI = -99;
  for (let i = 0; i < n; i++) {
    const f = A.frames[i], s = shoulderPx(A, f);
    let best = null, bestCost = Infinity;
    for (const c of cands[i]) {
      if (isStatic(c)) continue;
      const cost = prev && i - prevI <= 5
        ? Math.hypot((c[0] - prev[0]) * A.w, (c[1] - prev[1]) * A.h) / s / (i - prevI)
        : handDist(A, f, c);
      if (cost < bestCost) { best = c; bestCost = cost; }
    }
    if (best && bestCost < 4) { track.push(best); prev = best; prevI = i; } else track.push(null);
  }
  return track;
}

// 拍攝角度：側面拍時兩邊肩膀在畫面上重疊，肩寬遠小於軀幹長度；正面或背面拍時肩寬接近軀幹長度。
// 面向：側面時鼻尖在耳朵前方，鼻尖在耳朵右邊即向右。
function cameraView(A) {
  let total = 0, side = 0, facing = 0;
  for (const f of A.frames) {
    const p = f.pose, ok = i => p && p[i * 4 + 3] >= MIN_VIS;
    if (![11, 12, 23, 24].every(ok)) continue;
    const px = i => [p[i * 4] * A.w, p[i * 4 + 1] * A.h], mid = (a, b) => px(a).map((v, k) => (v + px(b)[k]) / 2);
    total++;
    if (Math.hypot(...sub(px(11), px(12))) / Math.hypot(...sub(mid(11, 12), mid(23, 24))) < 0.45) side++;
    const ears = [7, 8].filter(ok);
    if (ok(0) && ears.length) facing += Math.sign(px(0)[0] - ears.reduce((s, i) => s + px(i)[0], 0) / ears.length);
  }
  return { side: total > 0 && side / total >= 0.5, facing: facing < 0 ? -1 : 1 };
}

// ---- 動作辨識 ----
// 不用預先選動作類型：由關節座標自動找出影片中的跳投、上籃、轉身及運球，每段動作有自己的關鍵時刻。
// 起跳以「腳踝比前後 0.6 秒內站地位置高出多少」判斷，球員走近或走遠鏡頭也不會誤判。
function findActions(A) {
  const F = A.frames, n = F.length, fps = A.fps, win = Math.round(fps * 0.6), segs = [];
  const y = (f, j) => f.pose && f.pose[j * 4 + 3] >= MIN_VIS ? f.pose[j * 4 + 1] : null;
  const x = (f, j) => f.pose && f.pose[j * 4 + 3] >= MIN_VIS ? f.pose[j * 4] : null;
  const height = i => { const a = y(F[i], 27) ?? y(F[i], 28), s = y(F[i], 0); return a != null && s != null && a > s ? a - s : null; };   // 鼻至腳踝
  const knee = i => { const m = A.metrics[i]; return m ? bothSides(m, 'knee') : null; };
  const argBest = (from, to, val, better) => {
    let best = -1;
    for (let i = Math.max(0, from); i <= Math.min(n - 1, to); i++) { const v = val(i); if (v != null && (best < 0 || better(v, val(best)))) best = i; }
    return best;
  };
  const lower = (a, b) => a < b, higher = (a, b) => a > b;
  const overlaps = (from, to) => segs.some(s => s.from <= to && s.to >= from);
  if (A.role === 'defender') return findDefense(A, knee);   // 雙人模式的防守者只找防守動作

  // ---- 跳起：跳投或上籃 ----
  const ank = F.map(f => { const a = y(f, 27), b = y(f, 28); return a != null && b != null ? (a + b) / 2 : null; });
  const rise = ank.map((a, i) => {
    const sh = y(F[i], 11) ?? y(F[i], 12);
    if (a == null || sh == null || a <= sh) return null;
    // 地面要前後兩邊都找得到（取兩邊最低點中較高者）：慢慢走遠時不會當成跳起，只有急升急降才算
    let before = a, after = a;
    for (let j = Math.max(0, i - win); j < i; j++) if (ank[j] != null) before = Math.max(before, ank[j]);
    for (let j = i + 1; j <= Math.min(n - 1, i + win); j++) if (ank[j] != null) after = Math.max(after, ank[j]);
    return (Math.min(before, after) - a) / (a - sh);   // 以肩至腳踝高度為單位
  });
  const apexes = rise.flatMap((r, i) => r != null && r >= 0.06
    && rise.slice(Math.max(0, i - win), i).every(q => q == null || q < r)
    && rise.slice(i + 1, i + win + 1).every(q => q == null || q <= r) ? [i] : []);
  const handUp = i => [15, 16].some(w => y(F[i], w) != null && y(F[i], 0) != null && y(F[i], w) < y(F[i], 0));
  const topWrist = i => { const v = [y(F[i], 15), y(F[i], 16)].filter(q => q != null); return v.length ? Math.min(...v) : null; };
  // 收球時雙手常被球和身體遮住，所以這裡放寬可見度要求
  const handsGap = i => { const p = F[i].pose; return p && p[15 * 4 + 3] > 0.2 && p[16 * 4 + 3] > 0.2 ? Math.hypot(p[15 * 4] - p[16 * 4], p[15 * 4 + 1] - p[16 * 4 + 1]) : null; };
  let prevLand = 0;
  for (const apex of apexes) {
    // 離地與落地：腳踝高出地面不足最高點的兩成即視為著地（避免把起跳前的小碎步當成跳起）
    const air = Math.max(0.02, rise[apex] * 0.2);
    let take = apex, land = apex;
    while (take > prevLand && (rise[take - 1] ?? 0) > air) take--;
    while (land < n - 1 && (rise[land + 1] ?? 0) > air) land++;
    take = Math.max(take - 1, prevLand); land = Math.min(land + 1, n - 1);
    if ((land - take) / fps < 0.2) continue;   // 太短：碎步、小跳
    // 單腳起跳：騰空前段兩邊腳踝高低相差明顯（另一隻腳提膝）
    let lift = 0;
    for (let i = take; i <= apex; i++) { const a = y(F[i], 27), b = y(F[i], 28); if (a != null && b != null) lift = Math.max(lift, Math.abs(a - b)); }
    const oneFoot = lift / (height(apex) ?? 0.5) > 0.12;
    let upAny = false;
    for (let i = take; i <= Math.min(n - 1, land + Math.round(fps * 0.2)); i++) upAny ||= handUp(i);
    const type = oneFoot && upAny ? '上籃' : !oneFoot && handUp(apex) ? '跳投' : null;
    if (!type) continue;   // 例如持球跳停、搶籃板
    const ev = [], at = (label, i) => { if (i >= 0) ev.push({ label, i }); };
    if (type === '跳投') {
      at('蓄力最低', argBest(Math.max(prevLand, take - Math.round(fps * 1.2)), take, knee, lower));
      at('起跳', take); at('最高點', apex); at('落地', land);
      // 出手：出手一刻球常被手遮住，所以取騰空期間「球首次在頭頂上方、離手超過一個肩寬」的一格
      let rel = -1;
      for (let i = take; i <= land && rel < 0; i++) {
        const b = A.track[i], f = F[i];
        if (b && f.pose && handDist(A, f, b) > 1 && b[1] < f.pose[1]) rel = i;
      }
      if (rel >= 0) at('出手', rel);
      else {   // 看不到球時：以投籃手（最高點時較高那隻）手肘最伸直的一格估算
        const side = (y(F[apex], 16) ?? 1) < (y(F[apex], 15) ?? 1) ? 1 : 0;
        at('出手（估算）', argBest(take, Math.min(land, apex + Math.round(fps * 0.25)), i => A.metrics[i]?.side[side].elbow, higher));
      }
    } else {
      at('收球', argBest(Math.max(prevLand, take - Math.round(fps * 0.6)), take, handsGap, lower));   // 雙手最接近＝雙手持球
      at('起跳', take); at('最高點', apex);
      at('出手', argBest(take, Math.min(n - 1, land + Math.round(fps * 0.2)), topWrist, lower));      // 手舉得最高
      at('落地', land);
    }
    ev.sort((a, b) => a.i - b.i);
    segs.push({ type, from: ev[0].i, to: land, events: ev, take, apex, land });
    prevLand = land;
  }

  // ---- 轉身：左右肩的前後次序（深度差）轉了過去又轉回來 ----
  // 正對或背向鏡頭時深度差接近 0；360° 轉身中間有一段時間另一邊肩膀在前，大約是轉身的一半時間
  const zs = fillSmooth(F.map(f => f.pose && f.pose[11 * 4 + 3] > 0.3 && f.pose[12 * 4 + 3] > 0.3 ? f.pose[11 * 4 + 2] - f.pose[12 * 4 + 2] : null), 1) ?? [];
  let state = 0;
  const side = zs.map(z => (state = z > 0.08 ? 1 : z < -0.08 ? -1 : state));
  for (let i = 1; i < side.length; i++) {
    if (!side[i - 1] || side[i] === side[i - 1]) continue;
    let j = i;
    while (j < n && side[j] === side[i]) j++;
    const half = j - i;
    if (j < n && side[j] === side[i - 1] && half >= 3 && half / fps <= 1.2) {
      const from = Math.max(0, i - Math.round(half / 2)), to = Math.min(n - 1, j + Math.round(half / 2));
      if (!overlaps(from, to)) segs.push({ type: '轉身', from, to, turn: half * 2 / fps,
        events: [{ label: '開始轉身', i: from }, { label: '轉身一半', i: Math.round((i + j) / 2) }, { label: '完成轉身', i: to }] });
    }
    i = j - 1;
  }

  // ---- 運球（看得到球時）：球每次落到最低點（低過膝蓋）就是一下拍球；連續三下或以上、每下相隔 ≤ 1.2 秒為一段運球。
  // 換手（Crossover）：連續兩下落在身體不同的一邊（以臀部中間為界）。看不到球時改用下面以手判斷的方法。
  const kneeY = i => { const a = y(F[i], 25), b = y(F[i], 26); return a != null && b != null ? (a + b) / 2 : null; };
  const hipMidX = i => { const a = x(F[i], 23), b = x(F[i], 24); return a != null && b != null ? (a + b) / 2 : null; };
  const by = A.track.map(b => b?.[1] ?? null);
  const bounces = [];
  for (let i = 1; i < n - 1; i++) {
    if (by[i] == null || kneeY(i) == null || by[i] < kneeY(i)) continue;
    const win2 = Math.round(fps * 0.12);
    let lowest = true;
    for (let j = Math.max(0, i - win2); j <= Math.min(n - 1, i + win2); j++) if (j !== i && by[j] != null && by[j] > by[i]) lowest = false;
    if (lowest && (!bounces.length || i - bounces.at(-1) >= fps * 0.25)) bounces.push(i);
  }
  let bRun = [];
  const flushBall = () => {
    if (bRun.length >= 3) {
      const from = bRun[0], to = bRun.at(-1);
      const side = i => { const h = hipMidX(i); return h == null ? 0 : Math.sign(A.track[i][0] - h); };
      const switches = bRun.slice(1).filter((d, q) => side(d) && side(bRun[q]) && side(d) !== side(bRun[q]));
      let low = from;
      for (let i = from; i <= to; i++) if ((knee(i) ?? 999) < (knee(low) ?? 999)) low = i;
      if (!overlaps(from, to)) segs.push({ type: '運球', from, to, downs: bRun.slice(), switches: switches.length,
        events: [{ label: '開始運球', i: from }, { label: '最低一下', i: low }, ...switches.map(i => ({ label: '換手', i })), { label: '結束運球', i: to }]
          .sort((a, b) => a.i - b.i).filter((e, q, arr) => !q || e.i !== arr[q - 1].i || e.label === '換手') });
    }
    bRun = [];
  };
  for (const b of bounces) { if (bRun.length && (b - bRun.at(-1)) / fps > 1.2) flushBall(); bRun.push(b); }
  flushBall();

  // ---- 運球：較低那隻手有節奏地上下（每下 0.25–1 秒，手壓到臀部以下），最少三下 ----
  // 較低那隻手的高度（以身高為單位）；只看到一隻手也算，該格量不到身高就用全片中位數
  const hs = F.map((_, i) => height(i)).filter(v => v != null).sort((a, b) => a - b), hMed = hs[hs.length >> 1];
  const low = fillSmooth(F.map((f, i) => { const w = [y(f, 15), y(f, 16)].filter(v => v != null), h = height(i) ?? hMed; return w.length && h ? Math.max(...w) / h : null; }), 1.5) ?? [];
  const downs = [];   // 手在最低的格
  for (let i = 1, d = 1, c = 0; i < low.length; i++) {
    if (d > 0) { if (low[i] > low[c]) c = i; else if (low[c] - low[i] > 0.05) { downs.push(c); d = -1; c = i; } }
    else { if (low[i] < low[c]) c = i; else if (low[i] - low[c] > 0.05) { d = 1; c = i; } }
  }
  const belowHip = i => { const w = Math.max(y(F[i], 15) ?? 0, y(F[i], 16) ?? 0), hp = y(F[i], 23) ?? y(F[i], 24); return hp != null && w > hp; };
  let run = [];
  const flush = () => {
    if (run.length >= 3) {
      const from = run[0], to = run.at(-1);
      // 要有運球姿勢：屈膝（中位數 ≤ 155°），而且沒有手高過肩（排除走路擺手、投籃後舉手）
      const k = []; let armUp = false;
      for (let i = from; i <= to; i++) { const v = knee(i); if (v != null) k.push(v); armUp ||= [15, 16].some(w => y(F[i], w) != null && y(F[i], 11) != null && y(F[i], w) < y(F[i], 11)); }
      const crouched = k.length && k.sort((a, b) => a - b)[k.length >> 1] <= 155;
      // 換手（Crossover）：連續兩下由不同的手運球（較低那隻手換了邊）
      const hand = i => (y(F[i], 15) ?? 0) > (y(F[i], 16) ?? 0) ? 0 : 1;
      const switches = run.slice(1).filter((d, q) => hand(d) !== hand(run[q]));
      if (crouched && !armUp && !overlaps(from, to)) segs.push({ type: '運球', from, to, downs: run.slice(), switches: switches.length,
        events: [{ label: '開始運球', i: from }, { label: '最低一下', i: run.reduce((a, b) => low[b] > low[a] ? b : a) },
          ...switches.map(i => ({ label: '換手', i })), { label: '結束運球', i: to }].sort((a, b) => a.i - b.i) });
    }
    run = [];
  };
  for (const d of downs) {
    const gap = run.length ? (d - run.at(-1)) / fps : 0;
    // 雙人模式（斜角 2D）手的起落較慢較細，每下最多 1.6 秒
    if (!belowHip(d) || (run.length && (gap < 0.25 || gap > (A.twoD ? 1.6 : 1)))) flush();
    if (belowHip(d)) run.push(d);
  }
  flush();
  return segs.sort((a, b) => a.from - b.from);
}

// 防守（雙人模式的防守者）：貼近持球者（兩人臀部距離 ≤ 1.5 倍身高）的時間，中間斷開不多於 0.3 秒、持續至少 1 秒。
// 只用距離界定「正在防守」，站姿好不好（屈膝、站距、距離）留給判斷。
function findDefense(A, knee) {
  const n = A.frames.length, gapMax = Math.round(A.fps * 0.3), segs = [];
  const guarding = i => {
    const a = A.frames[i].pose, b = A.peer?.frames[i].pose;
    if (!a || !b) return false;
    const h = (Math.max(a[27 * 4 + 1], a[28 * 4 + 1]) - a[1]) * A.h || 1;
    return Math.hypot((a[23 * 4] + a[24 * 4] - b[23 * 4] - b[24 * 4]) / 2 * A.w, (a[23 * 4 + 1] + a[24 * 4 + 1] - b[23 * 4 + 1] - b[24 * 4 + 1]) / 2 * A.h) / h <= 1.5;
  };
  let from = -1, last = -1;
  const close = () => {
    if (from >= 0 && (last - from) / A.fps >= 1) {
      let low = from;
      for (let i = from; i <= last; i++) if ((knee(i) ?? 999) < (knee(low) ?? 999)) low = i;
      segs.push({ type: '防守', from, to: last, events: [{ label: '開始防守', i: from }, { label: '重心最低', i: low }, { label: '結束防守', i: last }] });
    }
    from = -1;
  };
  for (let i = 0; i < n; i++) {
    if (guarding(i)) { if (from < 0) from = i; last = i; }
    else if (from >= 0 && i - last > gapMax) close();
  }
  close();
  return segs;
}

// ---- 顯示 ----
let analysis = null, analyzing = false, dual = null;   // dual：雙人分析（analysis 是目前選中的那名球員）
const ANA_HINT = $('ana-status').textContent;
const layers = { pose: true, hands: true, face: true, ball: true };
$('ana-layers').append(...Object.entries({ pose: '身體', hands: '手部', face: '臉部', ball: '籃球' }).map(([k, name]) =>
  el('button', { textContent: name, className: 'on', onclick: e => { layers[k] = !layers[k]; e.target.classList.toggle('on', layers[k]); drawOverlay(); } })));
$('ana-legend').textContent = '實線：膝蓋角度　虛線：手肘角度　橙色：右　藍色：左。點擊圖表可跳到該時間。';

function showAnalysis(A) {
  dual = A?.people === 2 ? prepareDual(A) : null;
  if (dual) A = dual.persons[dual.pick];
  analysis = A;
  $('ana-out').hidden = !A; $('ana-run').hidden = !!A; $('ana-clear').hidden = !A || !!current?.sample;
  if (!A) { $('ana-status').textContent = ANA_HINT; updateRight(); renderBreakdown(); drawOverlay(); return; }
  prepare(A);
  $('view-pov').disabled = !A.pov;
  $('view-pov').title = A.pov ? '模擬球員眼中所見' : '雙人模式沒有 3D 座標，未能提供第一身視角';
  setView(A.pov ? viewMode : 'side');
  renderBreakdown();
  const pct = key => Math.round(100 * (key === 'ball' ? A.track : A.frames.map(f => f[key])).filter(Boolean).length / A.frames.length);
  const body = pct('pose');
  const partial = A.frames.at(-1).t < (current?.duration ?? 0) - 0.5 ? `（只分析頭 ${fmt(A.frames.at(-1).t)} 秒）` : '';
  $('ana-status').textContent = `已分析 ${A.frames.length} 格${partial}（每秒 ${Math.round(A.fps)} 格）。` + (dual
    ? `雙人模式：球員 ${dual.handler + 1} 持球、球員 ${2 - dual.handler} 防守，以下是球員 ${dual.pick + 1}。辨識到身體的畫面 ${body}%、`
    : `辨識到身體的畫面 ${body}%、左手 ${pct('lh')}%、右手 ${pct('rh')}%、臉部 ${pct('face')}%、`) + `籃球 ${pct('ball')}%（連推斷 ${Math.round(100 * A.ball.filter(Boolean).length / A.frames.length)}%）。`
    + (A.view.side ? `側面拍攝，球員向${A.view.facing > 0 ? '右' : '左'}。` : '這段影片不是側面拍攝，與側面的示範只能粗略對照；建議從側面重拍。')
    + (body < 50 ? '大部分畫面未能辨識身體，請全身入鏡、光線充足後重拍。' : '')
    + ((A.version ?? 1) < ANALYSIS_VERSION ? '這是舊版分析，清除後重新分析可得到更準確的結果。' : '');
  $('ana-events').replaceChildren(...(A.events.length ? A.events.map(e => el('button', {
    textContent: `${eventName(A, e)} ${fmt(A.frames[e.i].t)} 秒`, onclick: () => { video.pause(); video.currentTime = A.frames[e.i].t; }
  })) : [el('span', { className: 'meta', textContent: '未偵測到關鍵時刻。' })]));
  drawOverlay();
}

$('ana-run').onclick = async () => {
  if (analyzing) return;
  const clip = current, status = s => { if (current === clip) $('ana-status').textContent = s; };
  analyzing = true; $('ana-run').disabled = true; video.pause();
  updateRight(); renderBreakdown();
  try {
    const A = await analyzeClip(clip, await clipVideo(clip), status);
    await putAnalysis(A);
    if (current === clip) showAnalysis(A);
  } catch (err) {
    console.error(err);
    status(`分析失敗：${err?.message || err}。請檢查網絡連線後再試。`);
  } finally {
    analyzing = false; $('ana-run').disabled = false;
  }
};
$('ana-clear').onclick = async () => {
  if (!confirm('清除這段影片的骨架分析？')) return;
  await deleteAnalysis(current.id);
  showAnalysis(null);
};

const overlay = $('overlay'), octx = overlay.getContext('2d');
const frameIndex = t => Math.min(Math.max(Math.round(t * analysis.fps), 0), analysis.frames.length - 1);
function fitCanvas(c, ctx) {
  const dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  return [W, H];
}

function drawOverlay() {
  const [W, H] = fitCanvas(overlay, octx);
  if (!analysis || !video.videoWidth) return;
  // 影片以 object-fit: contain 顯示，先計出畫面實際所在範圍
  const s = Math.min(W / video.videoWidth, H / video.videoHeight), cw = video.videoWidth * s, ch = video.videoHeight * s;
  const ox = (W - cw) / 2, oy = (H - ch) / 2, i = frameIndex(video.currentTime), f = analysis.frames[i];
  if (video.currentTime > analysis.frames.at(-1).t + 1 / analysis.fps) {   // 超出已分析範圍
    $('ana-table').replaceChildren(el('tr', {}, [el('td', { textContent: '這段時間未有分析', colSpan: 3 })]));
    updateRight();
    return;
  }
  const xy = (arr, j, k) => [ox + arr[j * k] * cw, oy + arr[j * k + 1] * ch];
  const lines = (arr, k, conn, color, width, ok = () => true) => {
    octx.strokeStyle = color; octx.lineWidth = width; octx.beginPath();
    for (const [a, b] of conn) if (ok(a) && ok(b)) { octx.moveTo(...xy(arr, a, k)); octx.lineTo(...xy(arr, b, k)); }
    octx.stroke();
  };
  const joints = (arr, k, color, r, ok = () => true) => {
    octx.fillStyle = color;
    for (let j = 0; j < arr.length / k; j++) if (ok(j)) { octx.beginPath(); octx.arc(...xy(arr, j, k), r, 0, 7); octx.fill(); }
  };
  octx.lineCap = 'round'; octx.shadowColor = 'rgba(0,0,0,.7)'; octx.shadowBlur = 3;
  if (layers.face && f.face) {
    octx.fillStyle = 'rgba(255,255,255,.6)';
    for (let j = 0; j < f.face.length / 3; j++) { const [x, y] = xy(f.face, j, 3); octx.fillRect(x - 0.6, y - 0.6, 1.2, 1.2); }
  }
  if (layers.pose && f.pose) {
    const ok = j => j > 10 && f.pose[j * 4 + 3] >= MIN_VIS;
    for (const [color, conn] of POSE_GROUPS) lines(f.pose, 4, conn, color, 3, ok);
    joints(f.pose, 4, C_MID, 3, ok);
  }
  if (layers.pose && dual) {   // 雙人：另一名球員用白色細線
    const o = dual.persons[1 - dual.pick].frames[i].pose;
    if (o) lines(o, 4, POSE_CONN, 'rgba(255,255,255,.7)', 2, j => j > 10 && o[j * 4 + 3] >= MIN_VIS);
  }
  if (layers.hands) for (const [hand, color] of [[f.lh, C_LEFT], [f.rh, C_RIGHT]]) {
    if (!hand) continue;
    lines(hand, 3, HAND_CONN, color, 1.5);
    joints(hand, 3, C_MID, 1.5);
  }
  if (layers.ball) {
    // 球路：最近一秒的位置
    const trail = analysis.track.slice(Math.max(0, i - Math.round(analysis.fps)), i + 1).filter(Boolean);
    octx.strokeStyle = C_BALL; octx.lineWidth = 2; octx.beginPath();
    trail.forEach((g, n) => octx[n ? 'lineTo' : 'moveTo'](...xy(g, 0, 4)));
    octx.stroke();
    // 目前位置：看到的畫實線圈，推斷的畫虛線圈
    const cur = (dual ? dual.persons[dual.handler] : analysis).ball?.[i];
    if (cur) { octx.lineWidth = 2.5; octx.setLineDash(cur[3] === BALL_SEEN ? [] : [4, 3]); octx.beginPath(); octx.arc(...xy(cur, 0, 4), cur[2] * cw, 0, 7); octx.stroke(); octx.setLineDash([]); }
  }
  octx.shadowBlur = 0;
  updateMetrics(i);
  drawChart(i);
  updateRight();
}

const ROWS = [['elbow', '手肘角度'], ['shoulder', '肩部角度'], ['hip', '髖部角度'], ['knee', '膝蓋角度'], ['ankle', '腳踝角度'], ['wrist', '手腕屈曲']];
function updateMetrics(i) {
  const m = analysis.metrics[i], deg = v => v == null ? '—' : `${Math.round(v)}°`;
  const one = (name, value) => el('tr', {}, [el('td', { textContent: name }), el('td', { textContent: value, colSpan: 2 })]);
  const rows = [el('tr', {}, [el('th', { textContent: `第 ${i + 1} 格・${fmt(analysis.frames[i].t)} 秒` }), el('th', { textContent: '左' }), el('th', { textContent: '右' })])];
  if (!m) rows.push(el('tr', {}, [el('td', { textContent: '這一格未能辨識身體', colSpan: 3 })]));
  else rows.push(
    ...ROWS.map(([k, name]) => el('tr', {}, [el('td', { textContent: name }), el('td', { textContent: deg(m.side[0][k]) }), el('td', { textContent: deg(m.side[1][k]) })])),
    one('軀幹前傾', deg(m.lean)), one('站距 ÷ 肩寬', m.stance == null ? '—' : m.stance.toFixed(2)), one('身體辨識信心', `${Math.round(m.conf * 100)}%`));
  $('ana-table').replaceChildren(...rows);
}

const SERIES = [['knee', 1, C_RIGHT, []], ['knee', 0, C_LEFT, []], ['elbow', 1, C_RIGHT, [5, 4]], ['elbow', 0, C_LEFT, [5, 4]]];
const chart = $('ana-chart'), cctx = chart.getContext('2d');
function drawChart(cur) {
  const [W, H] = fitCanvas(chart, cctx), n = analysis.frames.length, css = getComputedStyle(document.body);
  const X = i => n > 1 ? i / (n - 1) * W : 0, Y = deg => H - 4 - deg / 180 * (H - 8);
  cctx.strokeStyle = css.getPropertyValue('--line'); cctx.lineWidth = 1; cctx.setLineDash([]);
  cctx.beginPath();
  for (const g of [0, 90, 180]) { cctx.moveTo(0, Y(g)); cctx.lineTo(W, Y(g)); }
  cctx.stroke();
  cctx.fillStyle = css.getPropertyValue('--muted'); cctx.font = '10px system-ui';
  cctx.fillText('180°', 2, Y(180) + 10); cctx.fillText('90°', 2, Y(90) - 2);
  for (const [key, s, color, dash] of SERIES) {
    cctx.strokeStyle = color; cctx.lineWidth = 1.5; cctx.setLineDash(dash); cctx.beginPath();
    let pen = false;
    analysis.metrics.forEach((m, i) => {
      const v = m?.side[s][key];
      if (v == null) { pen = false; return; }

    });

  }

  cctx.beginPath(); cctx.moveTo(X(cur), 0); cctx.lineTo(X(cur), H); cctx.stroke();
}

// ---- 動作拆解 ----
// 影片中每段動作逐一拆開：每個關鍵時刻有火柴人定格、量度數值，以及「做得好／可改善」。

const bothSides = (m, k) => { const v = [m.side[0][k], m.side[1][k]].filter(x => x != null); return v.length ? v.reduce((a, b) => a + b) / v.length : null; };

const METRICS = {
  蓄力最低: [KNEE, ['髖部角度', m => bothSides(m, 'hip')], LEAN], 起跳: [['腳踝角度', m => bothSides(m, 'ankle')]],
  出手: [ARM('出手手肘'), ['出手肩部', (m, s) => m.side[s].shoulder], LEAN], 最高點: [ARM('出手手肘'), KNEE],
  落地: [['站距 ÷ 肩寬', m => m.stance, true]], 收球: [KNEE, LEAN],
  開始轉身: [KNEE], 轉身一半: [KNEE, LEAN], 完成轉身: [KNEE], 開始運球: [KNEE, LEAN], 最低一下: [KNEE], 換手: [KNEE],
  開始防守: [KNEE], 重心最低: [KNEE]   // 站距在判斷中按穩定的方法計（2D 側身時肩寬不準），不在表中重複
};
const TIPS = {

// 每段動作的資料（用於判斷）
function segFacts(A, s) {
  const knees = (from, to) => A.metrics.slice(from, to + 1).map(m => m && bothSides(m, 'knee')).filter(v => v != null);
  const f = {};
  if (s.take != null) {
    const k = knees(s.take, s.apex); if (k.length) f.push = Math.max(...k);                       // 離地前膝蓋最伸直
    const c = knees(s.land, s.land + Math.round(A.fps * 0.3)); if (c.length) f.cushion = Math.min(...c);   // 落地後最彎
  }

    if (rel && apex) { f.late = A.frames[rel.i].t - A.frames[apex.i].t; f.estimated = rel.label.includes('估算'); }

  if (s.type === '上籃') {

    const hips = A.metrics.slice(s.take, s.apex + 1).flatMap(m => m ? [m.side[0].hip, m.side[1].hip].filter(v => v != null) : []);
    if (hips.length) f.drive = Math.min(...hips);
    // 收球到起跳之間最屈的膝蓋（最後一步蓄力）；跨步時一腳直一腳屈，所以兩邊分開看
    const g = s.events.find(e => e.label === '收球');
    const kn = g ? A.metrics.slice(g.i, s.take + 1).flatMap(m => m ? [m.side[0].knee, m.side[1].knee].filter(v => v != null) : []) : [];
    if (kn.length) f.load = Math.min(...kn);
  }
  if (s.type === '轉身') { const k = knees(s.from, s.to); if (k.length) f.low = Math.min(...k); f.turn = s.turn; }
  if (s.type === '防守') {
    const k = knees(s.from, s.to); if (k.length) f.low = Math.min(...k);
    f.twoD = !!A.twoD;
    // 站距：3D 用兩腳距離 ÷ 肩寬；2D（雙人模式）側身時肩膀重疊、肩寬量不準，改用兩腳距離 ÷ 身高再換算（肩寬約 0.25 倍身高）
    const st = (A.twoD
      ? A.frames.slice(s.from, s.to + 1).map(fr => { const p = fr.pose; if (!p || p[27 * 4 + 3] < MIN_VIS || p[28 * 4 + 3] < MIN_VIS) return null; const h = Math.max(p[27 * 4 + 1], p[28 * 4 + 1]) - p[1]; return h > 0 ? Math.hypot((p[27 * 4] - p[28 * 4]) * A.w, (p[27 * 4 + 1] - p[28 * 4 + 1]) * A.h) / (h * A.h) / 0.25 : null; })

    if (st.length) f.stanceMed = st[st.length >> 1];
    // 與持球者的距離：兩人臀部之間，以身高（鼻至腳踝）為單位
    const d = [];
    for (let i = s.from; i <= s.to; i++) {
      const a = A.frames[i].pose, b = A.peer?.frames[i].pose;
      if (!a || !b) continue;
      const h = (Math.max(a[27 * 4 + 1], a[28 * 4 + 1]) - a[1]) * A.h || 1;
      d.push(Math.hypot((a[23 * 4] + a[24 * 4] - b[23 * 4] - b[24 * 4]) / 2 * A.w, (a[23 * 4 + 1] + a[24 * 4 + 1] - b[23 * 4 + 1] - b[24 * 4 + 1]) / 2 * A.h) / h);
    }
    if (d.length) f.gap = d.sort((x, y) => x - y)[d.length >> 1];
  }
  if (s.type === '運球') {
    f.twoD = !!A.twoD;
    const k = knees(s.from, s.to); if (k.length) f.knee = k.sort((a, b) => a - b)[k.length >> 1];
    f.count = s.downs.length; f.rate = (s.downs.length - 1) / ((s.to - s.from) / A.fps || 1);
    // 最低一下時手的高度：到大腿中段以下為低（臀部與膝蓋的中間）
    const p = A.frames[s.events[1].i].pose;
    if (p) f.handLow = Math.max(p[15 * 4 + 1], p[16 * 4 + 1]) > ((p[23 * 4 + 1] + p[24 * 4 + 1]) / 2 + (p[25 * 4 + 1] + p[26 * 4 + 1]) / 2) / 2;
  }

}

// 這個時刻用手的一邊：跳投用投籃手；上籃用舉得較高的手
function handSide(A, e) {
  const s = A.segments[e.seg], p = A.frames[e.i].pose;
  if (s.type === '上籃' && p) return p[16 * 4 + 1] < p[15 * 4 + 1] ? 1 : 0;
  return A.side;
}
// 手肘角度：3D 看不清楚時（例如遠離鏡頭那隻手舉高），退而用畫面上的 2D 角度，可見度要求放寬到 0.3
function elbowAt(A, i, side) {
  const m = A.metrics[i], p = A.frames[i].pose;
  if (m?.side[side].elbow != null) return m.side[side].elbow;
  const [s, e, w] = [PL.sh[side], PL.el[side], PL.wr[side]];
  if (!p || [s, e, w].some(j => p[j * 4 + 3] < 0.3)) return null;
  const at = j => [p[j * 4] * A.w, p[j * 4 + 1] * A.h];
  return angleBetween(sub(at(s), at(e)), sub(at(w), at(e)));
}
function assess(A, e) {
  const m = A.metrics[e.i], s = A.segments[e.seg];
  if (!m) return [];
  const p = A.frames[e.i].pose;   // 這一格手是否壓到大腿中段以下（運球、換手用）
  const handLowNow = p ? Math.max(p[15 * 4 + 1], p[16 * 4 + 1]) > ((p[23 * 4 + 1] + p[24 * 4 + 1]) / 2 + (p[25 * 4 + 1] + p[26 * 4 + 1]) / 2) / 2 : null;
  const ctx = { twoD: !!A.twoD, handLowNow, knee: bothSides(m, 'knee'), elbow: elbowAt(A, e.i, handSide(A, e)), lean: m.lean, stance: m.stance, ...segFacts(A, s) };
  return (CHECKS[s.type][phaseKey(e.label)]?.(ctx) ?? []).filter(Boolean);
}
// 投籃手：第一次跳投最高點時較高的手腕
// 投籃手：每次投籃／上籃的出手和最高點，看哪隻手腕明顯較高（差距按身高計），全片加總投票。
// 側面拍時遠離鏡頭那隻手常被擋住、兩手高度差不多，只看一格會判錯，所以差距少於 3% 身高的不計。
function shootingSide(A) {
  let vote = 0;
  for (const e of A.events) {
    if (!['跳投', '上籃'].includes(A.segments[e.seg].type) || !/出手|最高點/.test(e.label)) continue;
    const p = A.frames[e.i].pose;
    if (!p) continue;
    const body = Math.max(Math.max(p[27 * 4 + 1], p[28 * 4 + 1]) - p[1], 0.05), d = (p[15 * 4 + 1] - p[16 * 4 + 1]) / body;

}
// 補上由原始關節座標推算的資料
// ---- 雙人：每名球員一份分析 ----
// MoveNet 的關節分數普遍較低（官方以 0.3 為門檻），換算成與 MediaPipe 可見度相同的尺度：0.3 → 0.5；補上的格保持 0.4 以下
const moveNetVis = p => { if (!p || p.filled) return p?.pose; const q = p.pose.slice(); for (let m = 0; m < 33; m++) q[m * 4 + 3] = Math.min(1, q[m * 4 + 3] / 0.6); return q; };
function personAnalysis(A, k) {
  return { id: A.id, version: A.version, fps: A.fps, w: A.w, h: A.h, ballTrack: A.ballTrack, person: k, twoD: true,
    frames: A.frames.map(f => ({ t: f.t, balls: f.balls, people: f.people, pose: moveNetVis(f.people?.[k]) ?? null, world: f.people?.[k]?.world ?? null, lh: null, rh: null, face: null })) };
}
// 持球者：看到籃球的格中，球較常在其手邊（0.12 倍畫面高度內）的一位
function ballHandler(A) {
  const near = [0, 0];
  A.frames.forEach((f, i) => {
    const b = A.ballTrack?.[i];
    if (b) f.people?.forEach((p, k) => {
      if (p && Math.min(...[15, 16].map(j => Math.hypot((b[0] - p.pose[j * 4]) * A.w, (b[1] - p.pose[j * 4 + 1]) * A.h))) < A.h * 0.12) near[k]++;

  A.persons.forEach((p, k) => { p.peer = A.persons[1 - k]; prepare(p); });

// ---- 推斷每一格的籃球位置 ----
// 影片拍不到球的格（被手或身體遮住、太細、模糊）也要有位置：
// - 拿着球：跟住手。由前後看到球時「球與手的相對位置」逐格過渡；換手時由一隻手移到另一隻；
// - 運球：手壓到最低之後，球落地再彈回手中（按該段運球的節奏推算）；
// - 空中（傳球、彈地、投籃後）：按重力拋物線連接前後看到的位置；最後一次看到時已在空中，就按拋物線延續到離開畫面。
// 結果每格 [x, y, 半徑, 來源]（座標為畫面比例）；來源 0 = 看到，1 = 拿着，2 = 運球，3 = 空中。看不到球員又無從推斷的格為 null。

// ---- 右邊火柴人複製真人動作（「你的動作」）----
// 用分析得到的關節座標逐格驅動火柴人：每個座標的時間序列先補洞、平滑，播放時在格與格之間用三次曲線補間，
// 並以螢幕更新率重畫，所以慢鏡也流暢。座標按全片固定比例換算，保留球員的移動和跳躍高度，也保留原本方向。
const MIMIC_VIS = 0.3;        // 低於此可見度的點視為缺漏，由前後格補上
const MIMIC_SMOOTH = 1;       // 高斯平滑的標準差（格）；太大會抹走快速動作

// 把有缺漏的時間序列補齊（線性補間，頭尾沿用最近值），再做高斯平滑
function fillSmooth(v, sigma) {
  const n = v.length, idx = v.flatMap((x, i) => x == null ? [] : [i]);

function buildMimic(A, shared) {

  // - 比例：肩→髖→膝→踝的骨長總和，彎腰屈膝也不變；
  // - 地面：前後 0.6 秒內兩邊都找得到的腳底位置（跳起時地面不會跟住升高）；
  // - 水平：前後 0.6 秒臀部位置的中位數置中。
  const median = a => { const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };

  const foot = track.aN.map((_, i) => Math.max(...['aN', 'aF', 'lN', 'lF', 'oN', 'oF'].map(k => track[k][i][1])));

  const scale = fillSmooth(bone.map(b => MIMIC_HEIGHT / (b * ref)), slow);
  const hipX = track.hN.map((p, i) => (p[0] + track.hF[i][0]) / 2);
  const cx = fillSmooth(hipX.map((_, i) => median(hipX.slice(Math.max(0, i - win), i + win + 1))), slow);
