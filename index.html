  const S = shared?.scale ?? scale, C = shared?.cx ?? cx;
  const toSvg = ([x, y], i) => [120 + (x - C[i]) * S[i], GROUND - (ground[i] - y) * S[i]];
  const out = {};
  for (const [name, pts] of Object.entries(track)) out[name] = pts.map(toSvg);
  return { pts: out, ball: ball.map((b, i) => b && toSvg(b, i)), ballSrc: A.ball.map(b => b?.[3]), n, fps: A.fps, tf: { scale, cx } };
}

// 播放時間 → 關節座標：Catmull-Rom 曲線在格與格之間補間，速度連續
function mimicAt(M, t) {
  const fi = Math.min(Math.max(t * M.fps, 0), M.n - 1), i = Math.floor(fi), u = fi - i;
  const at = k => Math.min(Math.max(k, 0), M.n - 1);
  const cr = (p0, p1, p2, p3) => [0, 1].map(c => 0.5 * (2 * p1[c] + (p2[c] - p0[c]) * u
    + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * u * u + (3 * p1[c] - p0[c] - 3 * p2[c] + p3[c]) * u * u * u));
  const P = {};
  for (const [name, pts] of Object.entries(M.pts)) P[name] = cr(pts[at(i - 1)], pts[i], pts[at(i + 1)], pts[at(i + 2)]);
  const b0 = M.ball[i], b1 = M.ball[at(i + 1)];
  const ball = b0 && b1 ? [0, 1].map(c => b0[c] + (b1[c] - b0[c]) * u) : (u < 0.5 ? b0 : b1);
  const src = M.ballSrc[u < 0.5 ? i : at(i + 1)], inferred = src != null && src !== BALL_SEEN;
  // 由 MediaPipe 的點組成火柴人的關節（名稱同 figurePaths()）
  const mix = (a, b, k) => [0, 1].map(c => a[c] + (b[c] - a[c]) * k);
  const j = {};
  for (const S of ['N', 'F']) {
    for (const k of ['s', 'e', 'w', 'h', 'k', 'a', 'l', 'o', 'u']) j[k + S] = P[k + S];
    j['g' + S] = mix(P['pk' + S], P['ix' + S], 0.5);   // 手掌中間
    j['q' + S] = P['ix' + S];                          // 食指
    const d = sub(P['o' + S], P['l' + S]), len = Math.hypot(...d) || 1;
    j['t' + S] = [P['o' + S][0] + d[0] / len * 3, P['o' + S][1] + d[1] / len * 3];   // 腳尖
  }
  j.p = mix(j.hN, j.hF, 0.5); j.n = mix(j.sN, j.sF, 0.5);
  j.m = mix(j.p, j.n, 1 / 3); j.c = mix(j.p, j.n, 2 / 3);
  j.h = P.ear; j.nk = mix(j.n, j.h, 0.45);
  const d = sub(P.nose, P.ear), len = Math.hypot(...d);
  if (len > 1) { j.ns = [j.h[0] + d[0] / len * 8, j.h[1] + d[1] / len * 8]; j.nose = [j.h[0] + d[0] / len * 11, j.h[1] + d[1] / len * 11]; }
  return { j, ball, inferred };
}

// 雙人時畫另一名球員（淡色）
function drawOther(t) {
  const O = dual?.persons[1 - dual.pick];
  if (!O?.mimic || !O.frames[frameIndex(t)].pose) return hideFigure(fig2);
  drawFigure(mimicAt(O.mimic, t).j, null, false, fig2);
}
// ---- 第一身視角（模擬）----
// 影片是側面拍的，沒有球員眼中的真實畫面，所以用 3D 骨架模擬：鏡頭放在雙眼位置、向鼻尖方向望，
// 畫出自己的手、腳、籃球，再加地板網格和一個虛擬籃框（放在球員面向的方向，假設 4.6 米、籃框高 3.05 米）。
// 只用單人分析的 3D 座標（MediaPipe 世界座標：米、以臀部為原點、y 向下、z 向遠離鏡頭）；雙人模式沒有 3D，不提供。
const POV_HOOP_DIST = 4.6, POV_RIM_H = 3.05, POV_RIM_R = 0.23, POV_FOV = 100;
let viewMode = 'side';   // 'side' = 側面火柴人；'pov' = 第一身

function buildPov(A) {
  if (A.twoD || !A.mimic) return null;
  const F = A.frames, n = F.length;
  const raw = F.map(f => f.world && f.pose ? f.world : null);
  if (raw.filter(Boolean).length < n * 0.3) return null;
  // 每個座標的時間序列先補洞、平滑（同火柴人）
  const cols = Array.from({ length: 33 * 3 }, (_, c) => fillSmooth(raw.map(w => w ? w[c] : null), 1.5));
  const at = (i, j) => [cols[j * 3][i], cols[j * 3 + 1][i], cols[j * 3 + 2][i]];
  const mid = (a, b) => a.map((v, k) => (v + b[k]) / 2);
  // 跳起高度：世界座標以臀部為原點，看不到跳起，所以借用火柴人（已處理鏡頭移動）的腳離地高度，換算成米（鼻至腳踝約 1.6 米）
  const M = A.mimic, footSvg = i => Math.max(...['aN', 'aF', 'lN', 'lF', 'oN', 'oF'].map(k => M.pts[k][i][1]));
  const gaps = Array.from({ length: n }, (_, i) => GROUND - footSvg(i)), base = [...gaps].sort((a, b) => a - b)[n >> 1];
  const lift = gaps.map(g => Math.max(0, g - base) * 1.6 / MIMIC_HEIGHT);
  // 籃框方向：全片面向（耳朵中間 → 鼻尖）水平方向的中位數
  const face = Array.from({ length: n }, (_, i) => sub(at(i, 0), mid(at(i, 7), at(i, 8))));
  const med = k => face.map(v => v[k]).sort((a, b) => a - b)[n >> 1];
  let hx = med(0), hz = med(2); const hl = Math.hypot(hx, hz) || 1; hx /= hl; hz /= hl;
  // 籃球 3D 位置：拿着時放在最近那隻手；在空中、運球時用畫面上相對臀部的位置換算成米，前後距離沿用最後拿着時
  const ballPts = [];
  let lastZ = 0;
  for (let i = 0; i < n; i++) {
    const b = A.ball[i], p = F[i].pose;
    if (!b || !p) { ballPts.push(null); continue; }
    const hands = [at(i, 19), at(i, 20)], img = j => [p[j * 4] * A.w, p[j * 4 + 1] * A.h];
    const near = [19, 20].map(j => Math.hypot(b[0] * A.w - img(j)[0], b[1] * A.h - img(j)[1]));
    const bodyPx = Math.max(Math.max(p[27 * 4 + 1], p[28 * 4 + 1]) - p[1], 0.05) * A.h, m = 1.6 / bodyPx;
    if (b[3] === BALL_HELD || Math.min(...near) < bodyPx * 0.15) {
      // 拿球的手：側面拍時兩手在畫面上重疊，所以只要投籃手不比另一隻手遠太多就算投籃手拿着
      const k = near[A.side] < near[1 - A.side] + bodyPx * 0.15 ? A.side : 1 - A.side;
      // 球心在手掌外面：沿前臂方向（手肘 → 食指）再出 0.12 米，舉到額前時球在手上方，抱在胸前時球在手前面
      const hnd = hands[k], dir = sub(hnd, at(i, 13 + k)), dl = Math.hypot(...dir) || 1;
      const c = hnd.map((v, q) => v + dir[q] / dl * 0.12);
      ballPts.push(c); lastZ = c[2];
    } else {
      const hip = mid(img(23), img(24));
      ballPts.push(Object.assign([(b[0] * A.w - hip[0]) * m, (b[1] * A.h - hip[1]) * m, lastZ], { air: true }));
    }
  }
  // 與籃框距離：世界座標以臀部為原點，看不到球員在場上移動，所以上籃時模擬走近——
  // 上籃開始前 1 秒由 4.6 米漸近，最高點／出手時到 1 米，落地後 1 秒內退回 4.6 米
  const dist = new Array(n).fill(POV_HOOP_DIST), look = new Array(n).fill(0), ease = x => x * x * (3 - 2 * x), fps = A.fps;
  for (const s of A.segments.filter(s => s.type === '上籃')) {
    const peak = Math.min(...s.events.filter(e => /最高點|出手/.test(e.label)).map(e => e.i), s.to);
    const a = Math.max(0, s.from - Math.round(fps)), z = Math.min(n - 1, s.to + Math.round(fps));
    for (let i = a; i <= z; i++) {
      const x = i < peak ? (i - a) / Math.max(1, peak - a) : i <= s.to ? 1 : 1 - (i - s.to) / Math.max(1, z - s.to);
      dist[i] = Math.min(dist[i], POV_HOOP_DIST - (POV_HOOP_DIST - 1) * ease(x));
      look[i] = Math.max(look[i], ease(x));   // 上籃時眼睛望住籃框
    }
  }
  const floorAt = i => Math.max(...[27, 28, 29, 30, 31, 32].map(j => at(i, j)[1])) + lift[i];
  // 視線：頭的方向（耳朵中間 → 雙眼中間）再向下 12°（人平時眼睛略向下望）；
  // 球在 1.5 米內時眼睛會跟住球（接球、運球、出手前），向球的方向轉一半，所以伸出去接球的雙手看得到；最後再平滑免得鏡頭抖
  const gaze = Array.from({ length: n }, (_, i) => {
    const eye = mid(at(i, 2), at(i, 5)), h = sub(eye, mid(at(i, 7), at(i, 8))), hl = Math.hypot(...h) || 1;
    let g = [h[0] / hl, h[1] / hl + Math.sin(12 * Math.PI / 180), h[2] / hl];
    const b = ballPts[i], bl = b && Math.hypot(...sub(b, eye));
    if (b && bl < 1.5) {
      // 望住球入手：瞄準球與雙手中間，接球時伸出去的手和飛來的球都在畫面內
      const d = sub(mid(b, mid(at(i, 19), at(i, 20))), eye), dl = Math.hypot(...d) || 1, w = 0.6;
      g = g.map((v, q) => v * (1 - w) + d[q] / dl * w);
    }
    if (look[i]) {
      const rim = sub([hx * dist[i], floorAt(i) - POV_RIM_H, hz * dist[i]], eye), rl = Math.hypot(...rim), w = look[i] * 0.7;
      g = g.map((v, q) => v * (1 - w) + rim[q] / rl * w);
    }
    return g;
  });
  const gz = [0, 1, 2].map(q => fillSmooth(gaze.map(g => g[q]), 4));
  return { at, n, fps: A.fps, lift, hoop: [hx, hz], ball: ballPts, face, dist, gaze: i => [gz[0][i], gz[1][i], gz[2][i]] };
}

function drawPov(t) {
  const P = analysis.pov, c = $('pov'), ctx = c.getContext('2d');
  const [W, H] = fitCanvas(c, ctx), css = getComputedStyle(document.body);
  const fi = Math.min(Math.max(t * P.fps, 0), P.n - 1), i = Math.floor(fi), k = Math.min(i + 1, P.n - 1), u = fi - i;
  const lerp3 = (a, b) => a.map((v, q) => v + (b[q] - v) * u);
  const pt = j => lerp3(P.at(i, j), P.at(k, j));
  const mid = (a, b) => a.map((v, q) => (v + b[q]) / 2);
  const norm = v => { const l = Math.hypot(...v) || 1; return v.map(x => x / l); };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  // 鏡頭：雙眼中間；方向見 buildPov 的視線（頭的方向加跟球）
  const eye = mid(pt(2), pt(5)), f = norm(lerp3(P.gaze(i), P.gaze(k)));
  const r = norm(cross(f, [0, -1, 0])), up = cross(r, f);
  const focal = W / 2 / Math.tan(POV_FOV / 2 * Math.PI / 180);
  const proj = p => { const d = sub(p, eye), z = dot(d, f); return z < 0.05 ? null : [W / 2 + focal * dot(d, r) / z, H / 2 - focal * dot(d, up) / z]; };
  const poly = (pts, color, width) => {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
    let pen = false;
    for (const p of pts) { const s = p && proj(p); if (!s) { pen = false; continue; } ctx[pen ? 'lineTo' : 'moveTo'](...s); pen = true; }
    ctx.stroke();
  };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // 地板：最低那隻腳之下，再加跳起高度
  const floor = Math.max(...[27, 28, 29, 30, 31, 32].map(j => pt(j)[1])) + P.lift[i] + (P.lift[k] - P.lift[i]) * u;
  const line = css.getPropertyValue('--line'), text = css.getPropertyValue('--text'), muted = css.getPropertyValue('--muted'), accent = css.getPropertyValue('--accent');
  for (let g = -8; g <= 8; g += 1) {
    poly(Array.from({ length: 33 }, (_, q) => [g, floor, -8 + q / 2]), line, 1);
    poly(Array.from({ length: 33 }, (_, q) => [-8 + q / 2, floor, g]), line, 1);
  }
  // 虛擬籃框：在面向方向（平時 4.6 米，上籃時走近）、高 3.05 米；籃板在籃框後面
  const [hx, hz] = P.hoop, side = [-hz, 0, hx], hd = P.dist[i] + (P.dist[k] - P.dist[i]) * u;
  const rim = [hx * hd, floor - POV_RIM_H, hz * hd];
  poly(Array.from({ length: 25 }, (_, q) => { const a = q / 24 * 2 * Math.PI; return [rim[0] + Math.cos(a) * POV_RIM_R, rim[1], rim[2] + Math.sin(a) * POV_RIM_R]; }), accent, 3);
  const bc = [rim[0] + hx * 0.38, 0, rim[2] + hz * 0.38], corner = (s, h) => [bc[0] + side[0] * s, floor - h, bc[2] + side[2] * s];
  poly([corner(-0.9, 2.9), corner(0.9, 2.9), corner(0.9, 3.95), corner(-0.9, 3.95), corner(-0.9, 2.9)], muted, 2);
  poly([[rim[0] + hx * 0.38, floor, rim[2] + hz * 0.38], corner(0, 2.9)], muted, 2);   // 籃架
  // 自己的身體：手臂（含手掌）、身體、腳
  for (const [s, e, w, ix] of [[11, 13, 15, 19], [12, 14, 16, 20]]) poly([pt(s), pt(e), pt(w), pt(ix)], text, 4);
  for (const [w, pk, ix, th] of [[15, 17, 19, 21], [16, 18, 20, 22]]) { poly([pt(w), pt(pk), pt(ix), pt(w)], text, 6); poly([pt(w), pt(th)], text, 4); }   // 手掌、拇指
  poly([pt(11), pt(12)], text, 3); poly([pt(23), pt(24)], text, 3);
  for (const [h0, kn, an, toe] of [[23, 25, 27, 31], [24, 26, 28, 32]]) poly([pt(h0), pt(kn), pt(an), pt(toe)], muted, 3);
  // 籃球（半徑約 0.12 米）
  const b0 = P.ball[i], b1 = P.ball[k], b = b0 && b1 ? lerp3(b0, b1) : b0 ?? b1, s = b && proj(b);
  const z = s && dot(sub(b, eye), f);
  // 空中的球前後距離只是推算，太貼近眼睛（< 0.4 米）就不畫，免得一個大波擋住畫面；大小亦設上限
  if (s && !((b0?.air || b1?.air) && z < 0.4)) {
    ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(s[0], s[1], Math.min(W * 0.25, Math.max(3, focal * 0.12 / z)), 0, 7); ctx.fill();
  }
  // 視線中心
  ctx.strokeStyle = muted; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W / 2 - 6, H / 2); ctx.lineTo(W / 2 + 6, H / 2); ctx.moveTo(W / 2, H / 2 - 6); ctx.lineTo(W / 2, H / 2 + 6); ctx.stroke();
}

function setView(m) {
  viewMode = m;
  const pov = m === 'pov' && !!analysis?.pov;
  $('pov').hidden = !pov; $('demo-svg').style.display = pov ? 'none' : '';
  $('view-side').classList.toggle('on', !pov); $('view-pov').classList.toggle('on', pov);
  $('demo-dots').disabled = pov;
  updateRight();
}
$('view-side').onclick = () => setView('side');
$('view-pov').onclick = () => setView('pov');

function drawMimic(t) {
  const A = analysis;
  drawOther(t);
  if (!A.frames[frameIndex(t)].pose) {   // 這一格看不到球員，不要畫補出來的猜測
    hideFigure();
    $('demo-label').textContent = '畫面中看不到球員';
    $('demo-cue').textContent = '';
    return;
  }
  if (viewMode === 'pov' && A.pov) drawPov(t);
  else {
    const { j } = mimicAt(A.mimic, t);
    // 籃球跟持球者（雙人時看的是防守者也一樣畫出球）
    const { ball, inferred } = mimicAt((dual ? dual.persons[dual.handler] : A).mimic, t);
    drawFigure(j, ball, inferred);
  }
  const out = t > A.frames.at(-1).t + 1 / A.fps;
  const ev = A.events.filter(e => A.frames[e.i].t <= t + 1e-3).at(-1);
  $('demo-label').textContent = out ? '這段時間未有分析' : ev ? eventName(A, ev) : '準備';
  // 說明：這個時刻可改善的地方優先，否則顯示做得好的地方
  const checks = ev ? A.checks[A.events.indexOf(ev)] : [], c = checks.find(x => !x.ok) ?? checks[0];
  $('demo-cue').textContent = out || !c ? '' : `${c.ok ? '做得好' : '可改善'}：${c.text}`;
}
function updateRight() {
  if (analysis?.mimic) return drawMimic(video.currentTime);
  hideFigure(); hideFigure(fig2);
  $('demo-label').textContent = analyzing ? '分析中…' : '未有分析';
  $('demo-cue').textContent = '分析完成後，火柴人會逐格複製影片中的動作。';
}
// 播放時以螢幕更新率重畫右邊火柴人（影片本身每秒只有 30 格）
video.addEventListener('play', () => {
  const loop = () => { if (video.paused || video.ended) return; updateRight(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});

$('credit').replaceChildren(...SAMPLES.map(x => el('div', {}, [el('a', { href: x.creditUrl, textContent: x.credit, target: '_blank', rel: 'noopener' })])));
openLab(SAMPLE);
</script>
