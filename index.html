<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 籃球動作實驗室</title>
<meta name="description" content="上傳或拍攝籃球動作影片，慢動作、逐格檢視，並標記時間點筆記。">
<style>
  :root {
    --bg: #f6f4f0; --card: #fff; --text: #1d1b18; --muted: #6b665e; --line: #e2ddd4;
    --accent: #e4572e; --accent-text: #fff; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --card: #211f1d; --text: #f1ede6; --muted: #a39d93; --line: #35322e;
      --accent: #f0703f; --accent-text: #1a0f0a; --danger: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  h2 { font-size: 17px; margin: 24px 0 8px; }
  p.sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  button, select, input[type=text] {
    font: inherit; color: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); padding: 10px 14px; min-height: 44px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  button.link { border: 0; background: none; padding: 6px 8px; min-height: 0; color: var(--muted); }
  button.danger { color: var(--danger); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  label.field { display: block; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  label.field select { display: block; width: 100%; margin-top: 4px; }
  .hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .msg { font-size: 14px; color: var(--danger); margin: 10px 0 0; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  ul.list li:first-child { border-top: 0; }
  .clip-open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 4px 0; }
  .clip-open b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; }
  video { width: 100%; max-height: 60vh; background: #000; border-radius: 12px; display: block; }
  .time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
  input[type=range] { width: 100%; margin: 10px 0 4px; accent-color: var(--accent); }
  .mark-t { font-variant-numeric: tabular-nums; border: 0; background: none; padding: 4px 0; min-height: 0; color: var(--accent); font-weight: 600; }
  .mark-note { flex: 1; min-width: 0; word-break: break-word; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>

  <!-- 首頁：新增影片 + 影片庫 -->
  <section id="home">
    <h1>AI 籃球動作實驗室</h1>
    <p class="sub">上傳或拍攝動作影片，用慢動作與逐格檢視拆解細節，並在關鍵時間點寫下筆記。</p>

    <div class="card">
      <label class="field">動作類型
        <select id="action"></select>
      </label>
      <button class="primary" id="pick" style="width:100%">上傳或拍攝影片</button>
      <input type="file" id="file" accept="video/*" hidden>
      <p class="hint">建議拍攝全身入鏡、光線充足、長度 60 秒以內。影片只儲存在這部裝置的瀏覽器內，不會上傳。</p>
      <p class="msg" id="pick-msg" hidden></p>
    </div>

    <h2>我的影片</h2>
    <div class="card">
      <ul class="list" id="clips"></ul>
      <p class="empty" id="clips-empty">尚未有影片。</p>
    </div>
  </section>

  <!-- 檢視頁：播放、慢動作、逐格、時間點筆記 -->
  <section id="lab" hidden>
    <div class="row">
      <button class="link" id="back">← 返回</button>
      <span class="grow"></span>
      <button class="link danger" id="del">刪除影片</button>
    </div>
    <h1 id="lab-title"></h1>
    <p class="sub" id="lab-meta"></p>

    <video id="video" playsinline preload="auto"></video>
    <input type="range" id="seek" min="0" max="0" step="0.001" value="0" aria-label="時間軸">
    <div class="row">
      <span class="time" id="time">0.00 / 0.00 秒</span>
    </div>

    <div class="row" style="margin-top:10px">
      <button id="prev" aria-label="上一格">◀ 上一格</button>
      <button class="primary grow" id="play">播放</button>
      <button id="next" aria-label="下一格">下一格 ▶</button>
    </div>
    <div class="row" style="margin-top:8px" id="speeds"></div>

    <h2>時間點筆記</h2>
    <div class="card">
      <div class="row">
        <input type="text" class="grow" id="note" placeholder="例如：出手前身體向右傾" maxlength="200">
        <button class="primary" id="add-mark">標記目前時間</button>
      </div>
      <ul class="list" id="marks" style="margin-top:8px"></ul>
      <p class="empty" id="marks-empty">暫停在關鍵畫面（準備、發力、出手、落地），再按「標記目前時間」。</p>
    </div>
  </section>

</main>
<script>
// ---- 可調常數 ----
const ACTIONS = ['投籃', '運球', '上籃', '急停跳投', '傳球', '防守', '其他'];
const SPEEDS = [0.25, 0.5, 1];
const FRAME = 1 / 30;            // 逐格步長（秒）；以 30fps 計
const MAX_MB = 300;              // 單一影片大小上限
const MAX_SEC = 120;             // 單一影片長度上限

// ---- IndexedDB：clips 存資料，videos 存影片檔，分開以免改筆記時重寫影片 ----
const dbReady = new Promise((resolve, reject) => {
  const req = indexedDB.open('bball', 1);
  req.onupgradeneeded = () => {
    req.result.createObjectStore('clips', { keyPath: 'id' });
    req.result.createObjectStore('videos');
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
async function tx(stores, mode, fn) {
  const db = await dbReady;
  return new Promise((resolve, reject) => {
    const t = db.transaction(stores, mode);
    const out = fn(t);
    t.oncomplete = () => resolve(out && 'result' in out ? out.result : undefined);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const listClips = () => tx('clips', 'readonly', t => t.objectStore('clips').getAll());
const getVideo = id => tx('videos', 'readonly', t => t.objectStore('videos').get(id));
const putClip = clip => tx('clips', 'readwrite', t => { t.objectStore('clips').put(clip); });
const addClip = (clip, blob) => tx(['clips', 'videos'], 'readwrite', t => {
  t.objectStore('clips').put(clip);
  t.objectStore('videos').put(blob, clip.id);
});
const deleteClip = id => tx(['clips', 'videos'], 'readwrite', t => {
  t.objectStore('clips').delete(id);
  t.objectStore('videos').delete(id);
});

// ---- 小工具 ----
const $ = id => document.getElementById(id);
const fmt = s => (Math.round(s * 100) / 100).toFixed(2);
const fmtDate = ms => new Date(ms).toLocaleString('zh-Hant', { dateStyle: 'medium', timeStyle: 'short' });
const el = (tag, { dataset, ...props } = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  Object.assign(n.dataset, dataset);
  n.append(...kids);
  return n;
};
function showMsg(text) { $('pick-msg').textContent = text; $('pick-msg').hidden = !text; }

// 讀取影片長度；格式不支援時回傳 null
function probeDuration(blob) {
  return new Promise(resolve => {
    const v = document.createElement('video');
    const url = URL.createObjectURL(blob);
    const done = d => { URL.revokeObjectURL(url); resolve(d); };
    v.preload = 'metadata';
    v.onloadedmetadata = () => done(isFinite(v.duration) ? v.duration : null);
    v.onerror = () => done(null);
    v.src = url;
  });
}

// ---- 首頁 ----
$('action').append(...ACTIONS.map(a => el('option', { value: a, textContent: a })));
$('pick').onclick = () => { showMsg(''); $('file').click(); };
$('file').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (f.size > MAX_MB * 1024 * 1024) return showMsg(`影片超過 ${MAX_MB} MB，請剪短後再上傳。`);
  const dur = await probeDuration(f);
  if (dur == null) return showMsg('這部裝置的瀏覽器無法播放此影片格式，請改用 MP4 或 MOV。');
  if (dur > MAX_SEC) return showMsg(`影片長度超過 ${MAX_SEC} 秒，請只保留要分析的動作片段。`);
  const clip = {
    id: crypto.randomUUID(), name: f.name, action: $('action').value,
    created: Date.now(), duration: dur, marks: []
  };
  try {
    navigator.storage?.persist?.();
    await addClip(clip, f);
  } catch (err) {
    return showMsg('儲存失敗，可能是裝置空間不足。');
  }
  openLab(clip);
};

async function renderHome() {
  const clips = (await listClips()).sort((a, b) => b.created - a.created);
  $('clips').replaceChildren(...clips.map(c => el('li', {}, [
    el('button', { className: 'clip-open', onclick: () => openLab(c) }, [
      el('b', { textContent: `${c.action}・${c.name}` }),
      el('span', { className: 'meta', textContent: `${fmtDate(c.created)}・${fmt(c.duration)} 秒・${c.marks.length} 個筆記` })
    ])
  ])));
  $('clips-empty').hidden = clips.length > 0;
}

// ---- 檢視頁 ----
const video = $('video');
let current = null, videoUrl = null;

$('speeds').append(...SPEEDS.map(s => el('button', {
  textContent: s === 1 ? '正常' : `${s}×`, dataset: { speed: s },
  onclick: () => setSpeed(s)
})));
function setSpeed(s) {
  video.playbackRate = s;
  for (const b of $('speeds').children) b.classList.toggle('on', +b.dataset.speed === s);
}

async function openLab(clip) {
  const blob = await getVideo(clip.id);
  if (!blob) return showMsg('找不到影片檔案，可能已被瀏覽器清除。');
  current = clip;
  if (videoUrl) URL.revokeObjectURL(videoUrl);
  videoUrl = URL.createObjectURL(blob);
  video.src = videoUrl;
  setSpeed(0.5);
  $('lab-title').textContent = clip.action;
  $('lab-meta').textContent = `${clip.name}・${fmtDate(clip.created)}`;
  $('note').value = '';
  renderMarks();
  $('home').hidden = true; $('lab').hidden = false;
  scrollTo(0, 0);
}

function closeLab() {
  video.pause();
  video.removeAttribute('src'); video.load();
  if (videoUrl) URL.revokeObjectURL(videoUrl);
  videoUrl = null; current = null;
  $('lab').hidden = true; $('home').hidden = false;
  renderHome();
}

function step(dir) {
  video.pause();
  video.currentTime = Math.min(Math.max(video.currentTime + dir * FRAME, 0), video.duration || 0);
}

function updateTime() {
  const d = video.duration || 0;
  $('seek').max = d;
  $('seek').value = video.currentTime;
  $('time').textContent = `${fmt(video.currentTime)} / ${fmt(d)} 秒`;
}
video.addEventListener('loadedmetadata', updateTime);
video.addEventListener('timeupdate', updateTime);
video.addEventListener('seeked', updateTime);
video.addEventListener('play', () => $('play').textContent = '暫停');
video.addEventListener('pause', () => $('play').textContent = '播放');
video.addEventListener('ended', () => $('play').textContent = '重播');
$('seek').oninput = e => { video.pause(); video.currentTime = +e.target.value; };
$('play').onclick = () => video.paused ? video.play() : video.pause();
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('back').onclick = closeLab;
$('del').onclick = async () => {
  if (!confirm('確定刪除這段影片及所有筆記？此操作無法復原。')) return;
  await deleteClip(current.id);
  closeLab();
};

// 鍵盤：← → 逐格，空白鍵播放／暫停（輸入筆記時不攔截）
document.addEventListener('keydown', e => {
  if ($('lab').hidden || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
});

$('add-mark').onclick = async () => {
  video.pause();
  current.marks.push({ t: video.currentTime, note: $('note').value.trim() });
  current.marks.sort((a, b) => a.t - b.t);
  $('note').value = '';
  await putClip(current);
  renderMarks();
};
$('note').addEventListener('keydown', e => { if (e.key === 'Enter') $('add-mark').click(); });

function renderMarks() {
  $('marks').replaceChildren(...current.marks.map((m, i) => el('li', {}, [
    el('button', { className: 'mark-t', textContent: `${fmt(m.t)} 秒`,
      onclick: () => { video.pause(); video.currentTime = m.t; } }),
    el('span', { className: 'mark-note', textContent: m.note || '（未寫筆記）' }),
    el('button', { className: 'link danger', textContent: '刪除', ariaLabel: '刪除筆記',
      onclick: async () => { current.marks.splice(i, 1); await putClip(current); renderMarks(); } })
  ])));
  $('marks-empty').hidden = current.marks.length > 0;
}

renderHome();
</script>
</body>
</html>
