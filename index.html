<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 籃球動作實驗室</title>
<meta name="description" content="上傳或拍攝籃球動作影片，慢動作、逐格檢視，並標記時間點筆記。">
<style>
  :root {
    --bg: #f6f4f0; --card: #fff; --text: #1d1b18; --muted: #6b665e; --line: #e2ddd4;
    --accent: #e4572e; --accent-text: #fff; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --card: #211f1d; --text: #f1ede6; --muted: #a39d93; --line: #35322e;
      --accent: #f0703f; --accent-text: #1a0f0a; --danger: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  h2 { font-size: 17px; margin: 24px 0 8px; }
  p.sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  button, select, input[type=text] {
    font: inherit; color: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); padding: 10px 14px; min-height: 44px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  button.link { border: 0; background: none; padding: 6px 8px; min-height: 0; color: var(--muted); }
  button.danger { color: var(--danger); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  label.field { display: block; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  label.field select { display: block; width: 100%; margin-top: 4px; }
  .hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .msg { font-size: 14px; color: var(--danger); margin: 10px 0 0; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  ul.list li:first-child { border-top: 0; }
  .clip-open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 4px 0; }
  .clip-open b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; }
  video { width: 100%; max-height: 60vh; background: #000; border-radius: 12px; display: block; }
  .time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
  input[type=range] { width: 100%; margin: 10px 0 4px; accent-color: var(--accent); }
  .mark-t { font-variant-numeric: tabular-nums; border: 0; background: none; padding: 4px 0; min-height: 0; color: var(--accent); font-weight: 600; }
  .mark-note { flex: 1; min-width: 0; word-break: break-word; }
  .demo svg { display: block; width: 100%; max-height: 42vh; margin: 4px 0 8px; }
  .demo svg .near, .demo svg .far, .demo svg .body { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .demo svg .near, .demo svg .body { stroke: var(--text); }
  .demo svg .far { stroke: var(--muted); opacity: .6; }
  .demo svg .head { fill: var(--card); stroke: var(--text); stroke-width: 3; }
  .demo svg .ball { fill: var(--accent); }
  .demo svg .face { stroke-width: 2.5; }
  .demo svg .near, .demo svg .far { stroke-width: 3.5; }
  .demo svg .dot { display: none; fill: var(--accent); stroke: var(--card); stroke-width: .6; }
  .demo svg.dots .dot { display: inline; }
  .demo svg .court { stroke: var(--line); stroke-width: 2; fill: none; }
  .demo svg .rim { stroke: var(--accent); stroke-width: 3; }
  .demo-phase { margin: 0; min-height: 3em; font-size: 15px; }
  .demo-phase b { margin-right: 6px; }
  .demo-phases button { padding: 6px 10px; min-height: 36px; font-size: 14px; }
  details > summary { cursor: pointer; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>

  <!-- 首頁：新增影片 + 影片庫 -->
  <section id="home">
    <h1>AI 籃球動作實驗室</h1>
    <p class="sub">上傳或拍攝動作影片，用慢動作與逐格檢視拆解細節，並在關鍵時間點寫下筆記。</p>

    <div class="card">
      <label class="field">動作類型
        <select id="action"></select>
      </label>
      <button class="primary" id="pick" style="width:100%">上傳或拍攝影片</button>
      <input type="file" id="file" accept="video/*" hidden>
      <p class="hint">建議拍攝全身入鏡、光線充足、長度 60 秒以內。影片只儲存在這部裝置的瀏覽器內，不會上傳。</p>
      <p class="msg" id="pick-msg" hidden></p>
      <div id="demo-home" style="margin-top:16px">
        <div class="demo" id="demo">
          <svg id="demo-svg" viewBox="0 0 240 200" role="img" aria-label="動作示意動畫"></svg>
          <p class="demo-phase"><b id="demo-label"></b><span id="demo-cue"></span></p>
          <input type="range" id="demo-seek" min="0" max="0" step="0.01" value="0" aria-label="示範時間軸">
          <div class="row">
            <button class="primary" id="demo-play">播放示範</button>
            <span class="row" id="demo-speeds"></span>
            <button id="demo-dots">關節點</button>
          </div>
          <div class="row demo-phases" id="demo-phases" style="margin-top:8px"></div>
          <p class="hint">示意動畫只表達動作次序與要點，並非真人示範，也不是你的影片分析結果。</p>
        </div>
      </div>
    </div>

    <h2>我的影片</h2>
    <div class="card">
      <ul class="list" id="clips"></ul>
      <p class="empty" id="clips-empty">尚未有影片。</p>
    </div>
  </section>

  <!-- 檢視頁：播放、慢動作、逐格、時間點筆記 -->
  <section id="lab" hidden>
    <div class="row">
      <button class="link" id="back">← 返回</button>
      <span class="grow"></span>
      <button class="link danger" id="del">刪除影片</button>
    </div>
    <h1 id="lab-title"></h1>
    <p class="sub" id="lab-meta"></p>

    <video id="video" playsinline preload="auto"></video>
    <input type="range" id="seek" min="0" max="0" step="0.001" value="0" aria-label="時間軸">
    <div class="row">
      <span class="time" id="time">0.00 / 0.00 秒</span>
    </div>

    <div class="row" style="margin-top:10px">
      <button id="prev" aria-label="上一格">◀ 上一格</button>
      <button class="primary grow" id="play">播放</button>
      <button id="next" aria-label="下一格">下一格 ▶</button>
    </div>
    <div class="row" style="margin-top:8px" id="speeds"></div>

    <details class="card" id="lab-demo" style="margin-top:16px">
      <summary>示範動作</summary>
      <div id="lab-demo-box"></div>
    </details>

    <h2>時間點筆記</h2>
    <div class="card">
      <div class="row">
        <input type="text" class="grow" id="note" placeholder="例如：出手前身體向右傾" maxlength="200">
        <button class="primary" id="add-mark">標記目前時間</button>
      </div>
      <ul class="list" id="marks" style="margin-top:8px"></ul>
      <p class="empty" id="marks-empty">暫停在關鍵畫面（準備、發力、出手、落地），再按「標記目前時間」。</p>
    </div>
  </section>

</main>
<script>
// ---- 可調常數 ----
const ACTIONS = ['投籃', '運球', '上籃', '急停跳投', '傳球', '防守', '其他'];
const SPEEDS = [0.25, 0.5, 1];
const FRAME = 1 / 30;            // 逐格步長（秒）；以 30fps 計
const MAX_MB = 300;              // 單一影片大小上限
const MAX_SEC = 120;             // 單一影片長度上限

// ---- IndexedDB：clips 存資料，videos 存影片檔，分開以免改筆記時重寫影片 ----
const dbReady = new Promise((resolve, reject) => {
  const req = indexedDB.open('bball', 1);
  req.onupgradeneeded = () => {
    req.result.createObjectStore('clips', { keyPath: 'id' });
    req.result.createObjectStore('videos');
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
async function tx(stores, mode, fn) {
  const db = await dbReady;
  return new Promise((resolve, reject) => {
    const t = db.transaction(stores, mode);
    const out = fn(t);
    t.oncomplete = () => resolve(out && 'result' in out ? out.result : undefined);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const listClips = () => tx('clips', 'readonly', t => t.objectStore('clips').getAll());
const getVideo = id => tx('videos', 'readonly', t => t.objectStore('videos').get(id));
const putClip = clip => tx('clips', 'readwrite', t => { t.objectStore('clips').put(clip); });
const addClip = (clip, blob) => tx(['clips', 'videos'], 'readwrite', t => {
  t.objectStore('clips').put(clip);
  t.objectStore('videos').put(blob, clip.id);
});
const deleteClip = id => tx(['clips', 'videos'], 'readwrite', t => {
  t.objectStore('clips').delete(id);
  t.objectStore('videos').delete(id);
});

// ---- 小工具 ----
const $ = id => document.getElementById(id);
const fmt = s => (Math.round(s * 100) / 100).toFixed(2);
const fmtDate = ms => new Date(ms).toLocaleString('zh-Hant', { dateStyle: 'medium', timeStyle: 'short' });
const el = (tag, { dataset, ...props } = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  Object.assign(n.dataset, dataset);
  n.append(...kids);
  return n;
};
function showMsg(text) { $('pick-msg').textContent = text; $('pick-msg').hidden = !text; }

// 讀取影片長度；格式不支援時回傳 null
function probeDuration(blob) {
  return new Promise(resolve => {
    const v = document.createElement('video');
    const url = URL.createObjectURL(blob);
    const done = d => { URL.revokeObjectURL(url); resolve(d); };
    v.preload = 'metadata';
    v.onloadedmetadata = () => done(isFinite(v.duration) ? v.duration : null);
    v.onerror = () => done(null);
    v.src = url;
  });
}

// ---- 首頁 ----
$('action').append(...ACTIONS.map(a => el('option', { value: a, textContent: a })));
$('pick').onclick = () => { showMsg(''); $('file').click(); };
$('file').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (f.size > MAX_MB * 1024 * 1024) return showMsg(`影片超過 ${MAX_MB} MB，請剪短後再上傳。`);
  const dur = await probeDuration(f);
  if (dur == null) return showMsg('這部裝置的瀏覽器無法播放此影片格式，請改用 MP4 或 MOV。');
  if (dur > MAX_SEC) return showMsg(`影片長度超過 ${MAX_SEC} 秒，請只保留要分析的動作片段。`);
  const clip = {
    id: crypto.randomUUID(), name: f.name, action: $('action').value,
    created: Date.now(), duration: dur, marks: []
  };
  try {
    navigator.storage?.persist?.();
    await addClip(clip, f);
  } catch (err) {
    return showMsg('儲存失敗，可能是裝置空間不足。');
  }
  openLab(clip);
};

async function renderHome() {
  const clips = (await listClips()).sort((a, b) => b.created - a.created);
  $('clips').replaceChildren(...clips.map(c => el('li', {}, [
    el('button', { className: 'clip-open', onclick: () => openLab(c) }, [
      el('b', { textContent: `${c.action}・${c.name}` }),
      el('span', { className: 'meta', textContent: `${fmtDate(c.created)}・${fmt(c.duration)} 秒・${c.marks.length} 個筆記` })
    ])
  ])));
  $('clips-empty').hidden = clips.length > 0;
}

// ---- 檢視頁 ----
const video = $('video');
let current = null, videoUrl = null;

// 速度按鈕；回傳用來標示目前速度的函式
function speedButtons(box, pick) {
  box.append(...SPEEDS.map(s => el('button', {
    textContent: s === 1 ? '正常' : `${s}×`, dataset: { speed: s }, onclick: () => pick(s)
  })));
  return s => { for (const b of box.children) b.classList.toggle('on', +b.dataset.speed === s); };
}
const markSpeed = speedButtons($('speeds'), s => setSpeed(s));
function setSpeed(s) { video.playbackRate = s; markSpeed(s); }

async function openLab(clip) {
  const blob = await getVideo(clip.id);
  if (!blob) return showMsg('找不到影片檔案，可能已被瀏覽器清除。');
  current = clip;
  if (videoUrl) URL.revokeObjectURL(videoUrl);
  videoUrl = URL.createObjectURL(blob);
  video.src = videoUrl;
  setSpeed(0.5);
  $('lab-title').textContent = clip.action;
  $('lab-meta').textContent = `${clip.name}・${fmtDate(clip.created)}`;
  $('note').value = '';
  renderMarks();
  $('lab-demo').hidden = !DEMOS[clip.action];
  $('lab-demo-box').append($('demo'));
  loadDemo(clip.action);
  $('home').hidden = true; $('lab').hidden = false;
  scrollTo(0, 0);
}

function closeLab() {
  video.pause();
  video.removeAttribute('src'); video.load();
  if (videoUrl) URL.revokeObjectURL(videoUrl);
  videoUrl = null; current = null;
  $('demo-home').append($('demo'));
  loadDemo($('action').value);
  $('lab').hidden = true; $('home').hidden = false;
  renderHome();
}

function step(dir) {
  video.pause();
  video.currentTime = Math.min(Math.max(video.currentTime + dir * FRAME, 0), video.duration || 0);
}

function updateTime() {
  const d = video.duration || 0;
  $('seek').max = d;
  $('seek').value = video.currentTime;
  $('time').textContent = `${fmt(video.currentTime)} / ${fmt(d)} 秒`;
}
video.addEventListener('loadedmetadata', updateTime);
video.addEventListener('timeupdate', updateTime);
video.addEventListener('seeked', updateTime);
video.addEventListener('play', () => $('play').textContent = '暫停');
video.addEventListener('pause', () => $('play').textContent = '播放');
video.addEventListener('ended', () => $('play').textContent = '重播');
$('seek').oninput = e => { video.pause(); video.currentTime = +e.target.value; };
$('play').onclick = () => video.paused ? video.play() : video.pause();
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('back').onclick = closeLab;
$('del').onclick = async () => {
  if (!confirm('確定刪除這段影片及所有筆記？此操作無法復原。')) return;
  await deleteClip(current.id);
  closeLab();
};

// 鍵盤：← → 逐格，空白鍵播放／暫停（輸入筆記時不攔截）
document.addEventListener('keydown', e => {
  if ($('lab').hidden || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
});

$('add-mark').onclick = async () => {
  video.pause();
  current.marks.push({ t: video.currentTime, note: $('note').value.trim() });
  current.marks.sort((a, b) => a.t - b.t);
  $('note').value = '';
  await putClip(current);
  renderMarks();
};
$('note').addEventListener('keydown', e => { if (e.key === 'Enter') $('add-mark').click(); });

function renderMarks() {
  $('marks').replaceChildren(...current.marks.map((m, i) => el('li', {}, [
    el('button', { className: 'mark-t', textContent: `${fmt(m.t)} 秒`,
      onclick: () => { video.pause(); video.currentTime = m.t; } }),
    el('span', { className: 'mark-note', textContent: m.note || '（未寫筆記）' }),
    el('button', { className: 'link danger', textContent: '刪除', ariaLabel: '刪除筆記',
      onclick: async () => { current.marks.splice(i, 1); await putClip(current); renderMarks(); } })
  ])));
  $('marks-empty').hidden = current.marks.length > 0;
}

// ---- 動作示範：火柴人示意動畫 ----
// 每個動作只寫關鍵姿勢，中間自動補間；所有動作共用同一副骨架。
// 角度（度）：0 = 垂直向下，正數 = 向前（正面視角時為畫面右方）。
// arms = [前上臂, 前前臂, 後上臂, 後前臂]；legs = [前大腿, 前小腿, 後大腿, 後小腿]。
// 「前」指靠近鏡頭、深色那一邊（右手持球）；air = 離地高度。
// hand = [前手腕, 後手腕] 相對前臂的屈曲：正數 = 手腕向後翻（托球），負數 = 向前下壓（出手）。
// 腰、頸、腳掌的角度由軀幹前傾及離地高度自動推算，不用逐格寫。
const BODY = {
  trunk: 38, neck: 5, skull: 8, upper: 19, fore: 18, palm: 4, finger: 4, thumb: 3.5,
  thigh: 27, shin: 26, ankle: 4, heel: 3, sole: 7, toe: 3
};
const GROUND = 185, BALL_R = 6;
const P = (x, t, arms, legs, air = 0, hand = [0, 0]) => ({ x, t, arms, legs, air, hand });
const RUN_A = [30, 0, -25, -50], RUN_B = [-25, -50, 30, 0];
const SET = [160, 150, 135, 165], FOLLOW = [160, 140, 120, 150], LAND = [25, -10, 20, -15];

// keys：{ t 秒, label 階段, cue 要點, pose }；沒有 pose 即維持上一個姿勢。
// ball：[t, 位置]；'wN' = 前手持球，[x, y] 可用數字、關節名稱（取其座標）或 'floor'。
const DEMOS = {
  投籃: { hoop: true, keys: [
    { t: 0, label: '準備', cue: '雙腳與肩同寬，膝蓋微曲，球放在胸前，眼望籃框。', pose: P(70, 10, [40, 120, 30, 110], [25, -10, 15, -20]) },
    { t: 0.5, label: '下蹲蓄力', cue: '屈膝降低重心，把球帶到下巴前方，手肘對準籃框。', pose: P(70, 15, [60, 150, 50, 140], [45, -20, 35, -30], 0, [30, 0]) },
    { t: 0.85, label: '起跳舉球', cue: '雙腳蹬地向上，把球舉到額頭前上方的出手點。', pose: P(70, 3, [140, 180, 130, 170], [5, 0, 0, -5], 8, [70, 20]) },
    { t: 1.05, label: '出手', cue: '接近最高點時伸直手臂、手腕下壓，球從食指與中指離手。', pose: P(70, 3, SET, [2, -2, -2, -8], 14, [-20, 0]) },
    { t: 1.4, label: '落地與隨球', cue: '手臂保持伸直、手腕下垂，在起跳位置附近平穩落地。', pose: P(72, 5, FOLLOW, LAND, 0, [-100, -50]) },
    { t: 2.4 }
  ], ball: [[0, 'wN'], [1.05, 'wN'], [1.25, [122, 18]], [1.4, [150, 8]], [1.55, [178, 14]], [1.75, [211, 40]], [1.95, [212, 80]], [2.2, [208, 'floor']]] },

  運球: { keys: [
    { t: 0, label: '準備姿勢', cue: '屈膝降低重心，上身微向前，抬頭觀察場上。', pose: P(100, 20, [30, 70, 50, 70], [35, -15, 10, -25], 0, [20, 0]) },
    { t: 0.2, label: '下壓推球', cue: '用手指和指腹把球向下推，不要用手掌拍球。', pose: P(100, 20, [15, 15, 50, 70], [35, -15, 10, -25], 0, [-40, 0]) },
    { t: 0.32, label: '球觸地反彈', cue: '保持低重心，眼睛不看球。' },
    { t: 0.45, label: '迎球收回', cue: '球反彈時手掌在上方迎球、順勢緩衝，球不高於腰部。', pose: P(100, 20, [30, 70, 50, 70], [35, -15, 10, -25], 0, [20, 0]) },
    { t: 0.65, pose: P(100, 20, [15, 15, 50, 70], [35, -15, 10, -25], 0, [-40, 0]) },
    { t: 0.77 },
    { t: 0.9, pose: P(100, 20, [30, 70, 50, 70], [35, -15, 10, -25], 0, [20, 0]) },
    { t: 1.3 }
  ], ball: [[0, 'wN'], [0.2, 'wN'], [0.32, ['wN', 'floor']], [0.45, 'wN'], [0.65, 'wN'], [0.77, ['wN', 'floor']], [0.9, 'wN']] },

  上籃: { hoop: true, keys: [
    { t: 0, label: '運球推進', cue: '用慣用手在身體前側運球，加速接近籃框。', pose: P(50, 15, [20, 40, -20, 30], RUN_A) },
    { t: 0.3, pose: P(80, 15, [30, 70, 20, -10], RUN_B) },
    { t: 0.6, label: '收球・第一步', cue: '右腳踏出的同時雙手收球，把球護在胸前。', pose: P(110, 15, [40, 110, 40, 100], [30, 10, -20, -40]) },
    { t: 0.85, label: '第二步起跳', cue: '左腳踏地起跳，右膝向上提，把身體帶向籃框。', pose: P(140, 8, [100, 150, 80, 140], [80, 0, 15, 5], 0, [30, 0]) },
    { t: 1.1, label: '舉球上籃', cue: '在最高點伸直右手，用手腕輕托把球放到籃板方框。', pose: P(168, 8, [165, 170, 120, 150], [85, 10, 5, -10], 25, [-30, 0]) },
    { t: 1.45, label: '落地', cue: '雙腳落地、屈膝緩衝，保持平衡。', pose: P(182, 5, [60, 80, 50, 70], [25, -5, 20, -15]) },
    { t: 2.0 }
  ], ball: [[0, 'wN'], [0.15, ['wN', 'floor']], [0.3, 'wN'], [1.1, 'wN'], [1.25, [215, 28]], [1.4, [213, 52]], [1.6, [212, 110]], [1.8, [210, 'floor']]] },

  急停跳投: { hoop: true, keys: [
    { t: 0, label: '運球推進', cue: '抬頭運球推進，留意與防守者的距離。', pose: P(40, 15, [20, 40, -20, 30], RUN_A) },
    { t: 0.3, pose: P(68, 15, [30, 70, 20, -10], RUN_B) },
    { t: 0.55, label: '急停制動', cue: '一二步急停，前腳煞停、屈膝降低重心，上身不要繼續前衝。', pose: P(92, 5, [40, 110, 30, 110], [35, 10, -15, -35]) },
    { t: 0.8, label: '收球蓄力', cue: '雙腳站穩對準籃框，把球帶到出手點下方。', pose: P(96, 10, [60, 150, 50, 140], [40, -15, 30, -25], 0, [30, 0]) },
    { t: 0.97, pose: P(96, 3, [140, 180, 130, 170], [5, 0, 0, -5], 8, [70, 20]) },
    { t: 1.1, label: '起跳出手', cue: '垂直向上起跳，在最高點伸直手臂出手。', pose: P(96, 3, SET, [2, -2, -2, -8], 14, [-20, 0]) },
    { t: 1.45, label: '落地與隨球', cue: '在起跳位置附近落地，身體不要向前飄。', pose: P(98, 5, FOLLOW, LAND, 0, [-100, -50]) },
    { t: 2.5 }
  ], ball: [[0, 'wN'], [0.15, ['wN', 'floor']], [0.3, 'wN'], [1.1, 'wN'], [1.3, [142, 15]], [1.45, [168, 6]], [1.6, [192, 14]], [1.8, [211, 40]], [2.0, [212, 80]], [2.3, [208, 'floor']]] },

  傳球: { keys: [
    { t: 0, label: '持球於胸前', cue: '雙手持球在胸前，手肘自然向下，眼望傳球目標。', pose: P(80, 8, [30, 120, 25, 115], [15, -5, 10, -10], 0, [20, 20]) },
    { t: 0.4, label: '跨步', cue: '向傳球方向跨出一步，把力量由腳傳到手。', pose: P(88, 12, [20, 130, 18, 128], [35, 10, -15, -30], 0, [30, 30]) },
    { t: 0.65, label: '雙手推出', cue: '雙臂向前伸直，手腕外翻，拇指朝下。', pose: P(90, 12, [85, 90, 82, 88], [35, 10, -15, -30], 0, [-30, -30]) },
    { t: 1.0, label: '隨球動作', cue: '手臂保持伸直指向目標，球應該直線飛向隊友胸口。', pose: P(90, 12, [82, 85, 80, 84], [35, 10, -15, -30], 0, [-50, -50]) },
    { t: 1.8 }
  ], ball: [[0, 'wN'], [0.65, 'wN'], [0.95, [180, 'wN']], [1.2, [262, 'wN']]] },

  防守: { front: true, keys: [
    { t: 0, label: '防守姿勢', cue: '雙腳比肩寬，屈膝、臀部向後坐，雙手張開。', pose: P(90, 0, [70, 120, -60, -30], [40, -5, -40, 5]) },
    { t: 0.3, label: '領先腳跨出', cue: '移動方向那隻腳先橫向跨出，重心保持低而平。', pose: P(105, 0, [70, 120, -60, -30], [52, 12, -30, 2]) },
    { t: 0.55, label: '後腳跟上', cue: '後腳推地跟上，雙腳不交叉、不併攏。', pose: P(120, 0, [70, 120, -60, -30], [40, -5, -40, 5]) },
    { t: 0.85, pose: P(135, 0, [70, 120, -60, -30], [52, 12, -30, 2]) },
    { t: 1.1, pose: P(150, 0, [70, 120, -60, -30], [40, -5, -40, 5]) },
    { t: 1.4, label: '換方向', cue: '換方向時先降低重心，再由另一隻腳領先跨出。', pose: P(150, 0, [60, 30, -70, -120], [40, -5, -40, 5]) },
    { t: 1.7, pose: P(135, 0, [60, 30, -70, -120], [30, -2, -52, -12]) },
    { t: 1.95, pose: P(120, 0, [60, 30, -70, -120], [40, -5, -40, 5]) },
    { t: 2.25, pose: P(105, 0, [60, 30, -70, -120], [30, -2, -52, -12]) },
    { t: 2.5, pose: P(90, 0, [60, 30, -70, -120], [40, -5, -40, 5]) },
    { t: 2.9 }
  ], ball: [] }
};
for (const d of Object.values(DEMOS)) {
  d.keys.forEach((k, i) => { k.pose ??= d.keys[i - 1].pose; });
  d.ball = d.ball.map(([t, at]) => ({ t, at }));
  d.end = d.keys.at(-1).t;
  // 每個姿勢數值一欄，方便逐欄做平滑插值
  const vecs = d.keys.map(({ pose: p }) => [p.x, p.t, p.air, ...p.arms, ...p.legs, ...p.hand]);
  d.cols = vecs[0].map((_, c) => vecs.map(v => v[c]));
}
const fromVec = v => P(v[0], v[1], v.slice(3, 7), v.slice(7, 11), v[2], v.slice(11, 13));

// 由角度計出各關節座標（正向運動學），再把最低的腳放回地面。
// 共 31 個點，排法對應 MediaPipe Pose 的 33 點，日後可把用戶骨架直接疊在示範上比較。
// look = 視線目標（例如籃框），只用於側面視角。
const go = (p, deg, len) => { const r = deg * Math.PI / 180; return [p[0] + Math.sin(r) * len, p[1] + Math.cos(r) * len]; };
const clamp01 = v => Math.min(Math.max(v, 0), 1);
function solve(pose, front, look) {
  const sw = front ? 10 : 0, hw = front ? 7 : 0, t = pose.t;
  const [uN, fN, uF, fF] = pose.arms, [tN, sN, tF, sF] = pose.legs, [xN, xF] = pose.hand;
  const j = { p: [0, 0], hN: [hw, 0], hF: [-hw, 0] };
  // 脊椎三節：愈上愈前傾，背部呈弧線；頸和頭較直，保持抬頭
  j.m = go(j.p, 180 - t * 0.4, BODY.trunk / 3);
  j.c = go(j.m, 180 - t * 1.0, BODY.trunk / 3);
  j.n = go(j.c, 180 - t * 1.6, BODY.trunk / 3);
  j.nk = go(j.n, 180 - t * 0.8, BODY.neck);
  j.h = go(j.nk, 180 - t * 0.3, BODY.skull);
  j.sN = [j.n[0] + sw, j.n[1]]; j.sF = [j.n[0] - sw, j.n[1]];
  j.eN = go(j.sN, uN, BODY.upper); j.wN = go(j.eN, fN, BODY.fore);
  j.eF = go(j.sF, uF, BODY.upper); j.wF = go(j.eF, fF, BODY.fore);
  j.bN = go(j.wN, fN, BALL_R + 1); j.bF = go(j.wF, fF, BALL_R + 1);
  // 手：手掌（g）→ 微曲的手指（q），另加拇指（u）
  const hand = (w, a) => { const g = go(w, a, BODY.palm); return [g, go(g, a + 20, BODY.finger), go(w, a - 40, BODY.thumb)]; };
  [j.gN, j.qN, j.uN] = hand(j.wN, fN + xN);
  [j.gF, j.qF, j.uF] = hand(j.wF, fF + xF);
  j.kN = go(j.hN, tN, BODY.thigh); j.aN = go(j.kN, sN, BODY.shin);
  j.kF = go(j.hF, tF, BODY.thigh); j.aF = go(j.kF, sF, BODY.shin);
  const dy = GROUND - pose.air - BODY.ankle - Math.max(j.aN[1], j.aF[1]);
  for (const k in j) j[k] = [j[k][0] + pose.x, j[k][1] + dy];
  // 腳：腳跟（l）、前腳掌（o）、腳趾（t）。貼地時平放，離地愈高腳尖愈向下；前腳掌著地時腳趾保持平貼
  const foot = (a, side) => {
    const base = [a[0], a[1] + BODY.ankle];
    if (front) return [base, [a[0] + side * 5, base[1]], [a[0] + side * 7, base[1]]];
    const f = 90 - 55 * clamp01((GROUND - base[1]) / 14), under = go(a, f - 90, BODY.ankle), ball = go(under, f, BODY.sole);
    return [go(under, f + 180, BODY.heel), ball, go(ball, ball[1] > GROUND - 1.5 ? 90 : f, BODY.toe)];
  };
  [j.lN, j.oN, j.tN] = foot(j.aN, 1);
  [j.lF, j.oF, j.tF] = foot(j.aF, -1);
  // 鼻尖顯示頭部朝向：有籃框時望向籃框，否則望向前方
  if (!front) {
    const ang = look ? Math.min(150, Math.max(60, Math.atan2(look[0] - j.h[0], look[1] - j.h[1]) * 180 / Math.PI)) : 95;
    j.ns = go(j.h, ang, 8); j.nose = go(j.h, ang, 11);
  }
  return j;
}

function ballAt(at, j) {
  if (typeof at === 'string') return j['b' + at.slice(1)];
  const [x, y] = at;
  return [typeof x === 'string' ? j[x][0] : x,
    y === 'floor' ? GROUND - BALL_R : typeof y === 'string' ? j[y][1] : y];
}

// 單調三次插值：曲線經過每個關鍵姿勢，速度連續（不會每到一格就停頓），亦不會衝過頭
function tangent(T, V, i) {
  if (i <= 0 || i >= V.length - 1) return 0;
  const d0 = (V[i] - V[i - 1]) / (T[i] - T[i - 1]), d1 = (V[i + 1] - V[i]) / (T[i + 1] - T[i]);
  if (d0 * d1 <= 0) return 0;
  return Math.sign(d0) * Math.min(Math.abs(d0 + d1) / 2, 3 * Math.min(Math.abs(d0), Math.abs(d1)));
}
function hermite(T, V, i, u, m0 = tangent(T, V, i), m1 = tangent(T, V, i + 1)) {
  const h = T[i + 1] - T[i], u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * V[i] + (u3 - 2 * u2 + u) * h * m0 + (3 * u2 - 2 * u3) * V[i + 1] + (u3 - u2) * h * m1;
}
// 回傳 [前一個 key, 後一個 key, 進度 0–1]
function seg(list, time) {
  let i = 0;
  while (i < list.length - 1 && list[i + 1].t <= time) i++;
  return i === list.length - 1 ? [i, i, 0] : [i, i + 1, (time - list[i].t) / (list[i + 1].t - list[i].t)];
}

// SVG 元件只建立一次，每格更新座標
const SVGNS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  $('demo-svg').append(n);
  return n;
};
svgEl('line', { class: 'court', x1: 0, y1: GROUND + 1, x2: 240, y2: GROUND + 1 });
const hoop = [
  svgEl('line', { class: 'court', x1: 228, y1: 15, x2: 228, y2: 58 }),
  svgEl('polyline', { class: 'court', points: '202,45 206,62 220,62 224,45' }),
  svgEl('line', { class: 'rim', x1: 200, y1: 45, x2: 226, y2: 45 })
];
const fig = {
  farArm: svgEl('path', { class: 'far' }), farLeg: svgEl('path', { class: 'far' }),
  body: svgEl('path', { class: 'body' }), head: svgEl('circle', { class: 'head', r: 8 }),
  nose: svgEl('path', { class: 'body face' }),
  nearLeg: svgEl('path', { class: 'near' }), nearArm: svgEl('path', { class: 'near' }),
  ball: svgEl('circle', { class: 'ball', r: BALL_R })
};
// 關節點（可切換顯示）
const DOTS = ['p', 'm', 'c', 'n', 'nk', 'h', ...['s', 'e', 'w', 'g', 'q', 'u', 'h', 'k', 'a', 'l', 'o', 't'].flatMap(s => [s + 'N', s + 'F'])];
const dots = DOTS.map(() => svgEl('circle', { class: 'dot', r: 1.8 }));
$('demo-dots').onclick = () => $('demo-dots').classList.toggle('on', $('demo-svg').classList.toggle('dots'));

let demo = null, demoTime = 0, demoPlaying = false, demoSpeed = 0.5, demoLast = 0;
const markDemoSpeed = speedButtons($('demo-speeds'), s => { demoSpeed = s; markDemoSpeed(s); });
markDemoSpeed(demoSpeed);

function drawDemo() {
  const d = demo;
  const [i, k, u] = seg(d.keys, demoTime);
  const T = d.keys.map(key => key.t);
  const j = solve(fromVec(d.cols.map(col => i === k ? col[i] : hermite(T, col, i, u))), d.front, d.hoop && [213, 45]);
  const pt = n => j[n].map(v => v.toFixed(1)).join(',');
  const line = (...names) => 'M' + names.map(pt).join(' L');
  const arm = s => `${line('s' + s, 'e' + s, 'w' + s, 'g' + s, 'q' + s)} ${line('w' + s, 'u' + s)}`;
  const leg = s => `${line('h' + s, 'k' + s, 'a' + s, 'l' + s, 'o' + s, 't' + s)} ${line('a' + s, 'o' + s)}`;
  fig.farArm.setAttribute('d', arm('F')); fig.farLeg.setAttribute('d', leg('F'));
  fig.nearArm.setAttribute('d', arm('N')); fig.nearLeg.setAttribute('d', leg('N'));
  fig.body.setAttribute('d', `${line('hF', 'hN')} ${line('p', 'm', 'c', 'n', 'nk', 'h')} ${line('sF', 'sN')}`);
  fig.head.setAttribute('cx', j.h[0]); fig.head.setAttribute('cy', j.h[1]);
  fig.nose.setAttribute('d', j.nose ? line('ns', 'nose') : '');
  DOTS.forEach((n, x) => { dots[x].setAttribute('cx', j[n][0]); dots[x].setAttribute('cy', j[n][1]); });
  fig.ball.style.display = d.ball.length ? '' : 'none';
  if (d.ball.length) {
    const [bi, bk, bu] = seg(d.ball, demoTime);
    const A = d.ball[bi].at, B = d.ball[bk].at;
    let pos;
    if (bi === bk || (typeof A === 'string' && A === B)) pos = ballAt(A, j);   // 一直在手上
    else {
      // 球的路線同樣用平滑曲線；觸地那一格保持直線進出，反彈才夠利落
      const BT = d.ball.map(b => b.t), at = d.ball.map(b => ballAt(b.at, j));
      const floor = n => d.ball[n].at[1] === 'floor';
      pos = [0, 1].map(c => {
        const V = at.map(p => p[c]), slope = (V[bk] - V[bi]) / (BT[bk] - BT[bi]);
        return hermite(BT, V, bi, bu, floor(bi) ? slope : tangent(BT, V, bi), floor(bk) ? slope : tangent(BT, V, bk));
      });
    }
    fig.ball.setAttribute('cx', pos[0]); fig.ball.setAttribute('cy', pos[1]);
  }
  // 目前階段 = 時間上最近的一個有 label 的 key
  const phase = d.keys.filter(k => k.label && k.t <= demoTime + 1e-6).at(-1) ?? d.keys[0];
  $('demo-label').textContent = phase.label;
  $('demo-cue').textContent = phase.cue;
  for (const b of $('demo-phases').children) b.classList.toggle('on', +b.dataset.t === phase.t);
  $('demo-seek').value = demoTime;
}

function loadDemo(action) {
  pauseDemo();
  demo = DEMOS[action];
  $('demo').hidden = !demo;
  if (!demo) return;
  for (const n of hoop) n.style.display = demo.hoop ? '' : 'none';
  $('demo-seek').max = demo.end;
  $('demo-phases').replaceChildren(...demo.keys.filter(k => k.label).map(k => el('button', {
    textContent: k.label, dataset: { t: k.t }, onclick: () => { pauseDemo(); demoTime = k.t; drawDemo(); }
  })));
  demoTime = 0;
  drawDemo();
}

function tickDemo(now) {
  if (!demoPlaying) return;
  demoTime += Math.max(0, now - demoLast) / 1000 * demoSpeed;  // 首格的時間戳可能早於 performance.now()
  demoLast = now;
  if (demoTime > demo.end) demoTime = 0;
  drawDemo();
  requestAnimationFrame(tickDemo);
}
function pauseDemo() { demoPlaying = false; $('demo-play').textContent = '播放示範'; }
$('demo-play').onclick = () => {
  if (demoPlaying) return pauseDemo();
  demoPlaying = true; demoLast = performance.now();
  $('demo-play').textContent = '暫停';
  requestAnimationFrame(tickDemo);
};
$('demo-seek').oninput = e => { pauseDemo(); demoTime = +e.target.value; drawDemo(); };
$('action').onchange = () => loadDemo($('action').value);

loadDemo($('action').value);
renderHome();
</script>
